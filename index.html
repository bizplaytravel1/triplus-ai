<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트리플러스 AI 검색</title>

<!-- Firebase (compat 버전 - 간단하게 쓰기) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<!-- LZ-String 압축 (localStorage 용량 50-70% 절감) -->
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface2: #e8eef8;
  --border: #d0d9ee;
  --accent: #2563eb;
  --accent2: #059669;
  --accent3: #dc2626;
  --text: #1a1f36;
  --text2: #4b5680;
  --text3: #94a3c0;
  --warn: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 200; }
.logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.logo-text { font-size: 15px; font-weight: 700; }
.logo-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.hdr-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.status-badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 4px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
.status-ok { background: rgba(5, 150, 105, 0.12); color: var(--accent2); border: 1px solid rgba(5, 150, 105, 0.3); }
.status-warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }
.status-err { background: rgba(220, 38, 38, 0.12); color: var(--accent3); border: 1px solid rgba(220, 38, 38, 0.3); }

.main { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
.welcome { text-align: center; padding: 40px 20px; }
.welcome h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.welcome p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

.search-box { display: flex; gap: 10px; margin-bottom: 16px; }
.search-input-wrap { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; transition: all 0.2s; }
.search-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
.si-icon { color: var(--text3); margin-right: 12px; font-size: 16px; }
.search-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; padding: 16px 0; }
.search-input::placeholder { color: var(--text3); }
.clear-btn { background: var(--surface2); color: var(--text2); border: none; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; margin-left: 8px; transition: all 0.15s; padding: 0; line-height: 1; }
.clear-btn:hover { background: #ef4444; color: #fff; }
.clear-btn.show { display: flex; }
.search-btn { background: var(--accent); color: #fff; border: none; cursor: pointer; border-radius: 12px; padding: 0 24px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; transition: all 0.15s; white-space: nowrap; min-width: 90px; }
.search-btn:hover { background: #1d4ed8; }
.search-btn:disabled { background: var(--text3); cursor: not-allowed; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
.chips-label { font-size: 12px; color: var(--text3); margin-right: 4px; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
.chip:hover { border-color: var(--accent2); color: var(--accent2); }

.ai-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 24px 28px; margin-bottom: 24px; display: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
.ai-box.on { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ai-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.ai-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.05em; }
.ai-sub { font-size: 13px; color: var(--text2); flex: 1; }
.copy-btn { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); cursor: pointer; padding: 6px 12px; border-radius: 6px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { background: #dcfce7; color: #15803d; border-color: #86efac; }
.ai-content { font-size: 14.5px; line-height: 1.85; color: var(--text); }
.ai-content strong { color: var(--accent); font-weight: 700; }
.ai-content h3 { color: var(--accent); font-size: 14px; margin-top: 18px; margin-bottom: 8px; }
.ai-content p { margin: 8px 0 12px; }
.ai-content ul, .ai-content ol { margin: 8px 0 16px; padding-left: 22px; }
.ai-content li { margin-bottom: 4px; }
.ai-content table { border-collapse: collapse; margin: 12px 0 18px; width: 100%; font-size: 13.5px; }
.ai-content th, .ai-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.ai-content th { background: var(--surface2); font-weight: 600; }
.ai-content code { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

.ai-loading { display: flex; align-items: center; gap: 12px; color: var(--text2); font-size: 14px; padding: 12px 0; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sources-section { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); }
.sources-label { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
.source-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.source-card:hover { border-color: var(--accent); background: #fff; }
.source-card-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.source-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--accent); color: #fff; }
.source-tag.tag-qa { background: var(--accent2); }
.source-tag.tag-manual { background: var(--accent); }
.source-tag.tag-rule { background: #7c3aed; }
.source-tag.tag-route { background: #0891b2; }
.source-score { margin-left: auto; font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }
.source-title { font-weight: 500; color: var(--text); font-size: 13px; }
.source-body { font-size: 12px; color: var(--text2); margin-top: 6px; display: none; white-space: pre-wrap; padding: 8px; background: var(--surface); border-radius: 6px; max-height: 200px; overflow-y: auto; }
.source-card.open .source-body { display: block; }

.error-msg { background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.3); color: var(--accent3); padding: 14px 18px; border-radius: 8px; font-size: 13px; }
.info-msg { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; padding: 14px 18px; border-radius: 8px; font-size: 13px; line-height: 1.7; }

@media (max-width: 640px) {
  header { padding: 12px 16px; }
  .main { padding: 20px 16px 60px; }
  .ai-box { padding: 18px 20px; }
  .search-box { flex-direction: column; }
  .search-btn { padding: 14px; }
}
</style>
</head>
<body>

<header>
  <div class="logo-icon">✈</div>
  <div>
    <div class="logo-text">트리플러스 AI 검색</div>
    <div class="logo-sub">현대자동차 출장관리</div>
  </div>
  <div class="hdr-right">
    <span class="status-badge status-warn" id="statusBadge">로딩 중...</span>
  </div>
</header>

<div class="main">
  
  <div class="welcome" id="welcome">
    <h1>무엇을 도와드릴까요?</h1>
    <p>출장 규정, 정산 방법 등 무엇이든 자연스럽게 질문하세요.</p>
  </div>

  <div class="search-box">
    <div class="search-input-wrap">
      <span class="si-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="예: 출장 끝나고 4주 동안 정산 못 했는데 어떻게 되나요?" autocomplete="off">
      <button class="clear-btn" id="clearBtn" type="button" title="입력 내용 지우기">✕</button>
    </div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()">AI 검색</button>
  </div>

  <div class="chips">
    <span class="chips-label">자주 묻는 질문:</span>
    <span class="chip" onclick="setQ('임원 일비는 얼마인가요?')">임원 일비</span>
    <span class="chip" onclick="setQ('숙박비 한도가 어떻게 되나요?')">숙박비 한도</span>
    <span class="chip" onclick="setQ('출장 4주 미정산 시 어떻게 되나요?')">4주 자동회수</span>
    <span class="chip" onclick="setQ('하이패스 스크래핑 모듈 설치 오류 해결 방법?')">하이패스 오류</span>
    <span class="chip" onclick="setQ('남양연구소에서 양재 본사까지 교통비?')">남양↔양재</span>
  </div>

  <div class="ai-box" id="aiBox">
    <div class="ai-hdr">
      <span class="ai-badge">AI 답변</span>
      <span class="ai-sub" id="aiSub">현대자동차 트리플러스 자료 기반</span>
      <button class="copy-btn" id="copyBtn" type="button" onclick="copyAnswer()" style="display:none;" title="답변 복사">
        <span id="copyBtnIcon">📋</span>
        <span id="copyBtnText">복사</span>
      </button>
    </div>
    <div class="ai-content" id="aiContent"></div>
    <div class="sources-section" id="sourcesSection" style="display:none;">
      <div class="sources-label">📎 참고 자료</div>
      <div id="sourcesList"></div>
    </div>
  </div>

</div>

<script>
// ====================================================
// ⚠️ 본인 Firebase 프로젝트 설정으로 교체하세요
// ====================================================
const firebaseConfig = {
  apiKey: "AIzaSyB7iRmGK1tZnhncEH7sjaydZ8zHElqNpww",
  authDomain: "triplus-ai-821a7.firebaseapp.com",
  projectId: "triplus-ai-821a7",
  storageBucket: "triplus-ai-821a7.firebasestorage.app",
  messagingSenderId: "816305774166",
  appId: "1:816305774166:web:2de540a4375dd232f525f7"
};

const SYSTEM_PROMPT = `당신은 현대자동차 트리플러스(TRIP+) 출장관리 Q&A 도우미입니다. 제공된 자료만 근거로 답변하며, 없는 내용은 추측하지 마세요.

⚠️ 언어 규칙:
- 반드시 한국어로만 답변
- 외국어 단어 사용 금지

⚠️ 형식 규칙 (절대 준수):
- HTML 태그 절대 사용 금지
- 표는 반드시 markdown 형식만 사용: | 컬럼1 | 컬럼2 | 형태
- 목록은 반드시 markdown 형식만 사용: - 항목 또는 1. 항목
- 마크다운 헤더(##, ###) 사용 금지 → **굵은 글씨**로 섹션 제목 표현

🚫 절대 금지 - HTML 태그 출력 (가장 중요):
- 어떤 경우에도 다음 태그 출력 금지: <ul>, <li>, <ol>, <table>, <thead>, <tbody>, <tr>, <td>, <th>, <strong>, <b>, <em>, <i>, <p>, <br>, <div>, <span>, <h1>~<h6>
- 모든 답변은 100% markdown만 사용. HTML 한 태그라도 섞이면 화면이 깨짐.

🚫 절대 금지 - 조항 번호 인용:
- "제○조", "제○장", "○항", "○호" 등 조항/장/항/호 번호 인용 절대 금지

📋 답변 작성 핵심 원칙:
1. 결론을 한 문장으로 먼저
2. **굵은 헤더 + 불릿** 패턴
3. 불릿은 "**라벨**: 설명." 형식
4. 비교 정보는 markdown 표로
5. 예외/주의점은 **유의사항** 섹션에
6. 인사말/사과 제외

📎 출장규정집`;

// 전역 변수
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let CHUNKS = [];
let EMBEDDINGS = {};
let GEMINI_KEY = "";
let GROQ_KEY = "";
let HAS_EMBEDDINGS = false;

// ====================================================
// 초기화
// ====================================================
async function init() {
  console.log("📦 트리플러스 v2026-05-28 — HTML→markdown 변환 강화 + 캐시 자동 청소");
  setStatus("연결 중...", "warn");

  // ★ 마이그레이션 1: 옛 비압축 캐시 정리
  try {
    const oldMeta = localStorage.getItem("triplus_chunks_meta");
    if (oldMeta && oldMeta.length > 50000 && (oldMeta[0] === '[' || oldMeta[0] === '{')) {
      console.log("⚙️ 옛 비압축 캐시 감지 → 정리");
      localStorage.removeItem("triplus_chunks_meta");
      localStorage.removeItem("triplus_chunks_emb");
      localStorage.removeItem("triplus_chunks_cache_time");
      localStorage.removeItem("triplus_chunks_count");
    }
  } catch (_e) {}

  // ★ 마이그레이션 2: raw HTML이 남아있는 답변 캐시 자동 청소
  //   ▸ 버전 플래그로 한 번만 실행 (매번 청소 X → 캐시 보존 → API 호출 절약)
  //   ▸ renderMarkdown이 이제 HTML 잔여물도 변환하므로, 청소는 깔끔한 저장 위함
  try {
    const MIGRATION_VERSION = "v3_html_cleanup_2026_05_28";
    const lastMigration = localStorage.getItem("triplus_migration_version");
    if (lastMigration !== MIGRATION_VERSION) {
      const htmlTagRe = /<(ul|ol|li|table|thead|tbody|tr|th|td|strong|b|em|i|p|br|div|span)\b/i;
      const keysToCheck = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("ans_")) keysToCheck.push(k);
      }
      let cleaned = 0;
      for (const k of keysToCheck) {
        try {
          const obj = JSON.parse(localStorage.getItem(k));
          if (obj && obj.answer && htmlTagRe.test(obj.answer)) {
            localStorage.removeItem(k);
            cleaned++;
          }
        } catch (_e) { localStorage.removeItem(k); cleaned++; }
      }
      localStorage.setItem("triplus_migration_version", MIGRATION_VERSION);
      if (cleaned > 0) {
        console.log(`🧹 [최초 1회] raw HTML 답변 캐시 ${cleaned}개 청소. 이후 새로고침에서는 캐시 그대로 사용 (API 호출 0회).`);
      } else {
        console.log(`✓ [최초 1회] 청소할 답변 캐시 없음. 마이그레이션 플래그 저장.`);
      }
    } else {
      console.log(`✓ 답변 캐시 마이그레이션 이미 적용됨 (${MIGRATION_VERSION}). 캐시 그대로 사용.`);
    }
  } catch (_e) {}

  try {
    const configDoc = await db.collection("config").doc("public").get();
    if (!configDoc.exists) {
      setStatus("설정 필요", "err");
      showError("관리자가 아직 시스템을 초기화하지 않았습니다.");
      return;
    }
    GEMINI_KEY = configDoc.data().gemini_api_key || "";
    GROQ_KEY = configDoc.data().groq_api_key || "";
    
    if (!GEMINI_KEY && !GROQ_KEY) {
      setStatus("API 키 없음", "err");
      showError("API 키가 설정되지 않았습니다.");
      return;
    }
    
    const META_CACHE_KEY = "triplus_chunks_meta";
    const EMB_CACHE_KEY = "triplus_chunks_emb";
    const CACHE_TIME_KEY = "triplus_chunks_cache_time";
    const CACHE_COUNT_KEY = "triplus_chunks_count";
    const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000;
    const CHECK_INTERVAL = 12 * 60 * 60 * 1000;
    
    const urlParams = new URLSearchParams(window.location.search);
    const forceRefresh = urlParams.get('refresh') === '1';
    
    const cachedMeta = lzGet(META_CACHE_KEY);
    const cacheTime = parseInt(localStorage.getItem(CACHE_TIME_KEY) || "0");
    const cacheAge = Date.now() - cacheTime;
    const isValid = !forceRefresh && cachedMeta && cacheAge < CACHE_MAX_AGE;
    
    if (isValid) {
      try {
        CHUNKS = JSON.parse(cachedMeta);
        try {
          const cachedEmb = lzGet(EMB_CACHE_KEY);
          EMBEDDINGS = cachedEmb ? JSON.parse(cachedEmb) : {};
        } catch (e) { EMBEDDINGS = {}; }
        
        HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
        console.log(`✓ 캐시 사용: ${CHUNKS.length}개 청크`);
        setStatus(`✓ 준비 완료 (${CHUNKS.length}개, 캐시)`, "ok");
        
        if (cacheAge > CHECK_INTERVAL) {
          setTimeout(() => checkForUpdates(CHUNKS.length), 2000);
        }
        return;
      } catch (e) { console.warn("캐시 파싱 실패:", e); }
    }
    
    setStatus("자료 로드 중...", "warn");
    showLoadingMessage("자료 다운로드 중...");
    
    const snap = await db.collection("chunks").get();
    const totalDocs = snap.docs.length;
    
    CHUNKS = [];
    EMBEDDINGS = {};
    
    const BATCH_SIZE = 200;
    for (let i = 0; i < snap.docs.length; i += BATCH_SIZE) {
      const batch = snap.docs.slice(i, i + BATCH_SIZE);
      batch.forEach(doc => {
        const d = doc.data();
        CHUNKS.push({
          id: doc.id,
          source: d.source || "",
          category: d.category || "",
          title: d.title || "",
          content: d.content || "",
          search_text: d.search_text || ""
        });
        if (d.embedding && Array.isArray(d.embedding)) {
          EMBEDDINGS[doc.id] = d.embedding;
        }
      });
      
      const progress = Math.min(i + BATCH_SIZE, totalDocs);
      const percent = Math.round((progress / totalDocs) * 100);
      setStatus(`자료 처리 중... (${progress}/${totalDocs}, ${percent}%)`, "warn");
      showLoadingMessage(`자료 처리 중... (${progress}/${totalDocs})`);
      
      if (i + BATCH_SIZE < snap.docs.length) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
    
    setStatus("캐시 저장 중...", "warn");
    showLoadingMessage("캐시 저장 중...");
    
    const slimChunks = CHUNKS.map(c => ({
      id: c.id, source: c.source, category: c.category, title: c.title,
      search_text: c.search_text || ((c.title || "") + "\n" + (c.content || ""))
    }));
    const metaJson = JSON.stringify(slimChunks);
    const compressedMeta = window.LZString ? LZString.compressToUTF16(metaJson) : metaJson;
    trySaveMetaCache(compressedMeta, META_CACHE_KEY, CACHE_TIME_KEY, CACHE_COUNT_KEY, CHUNKS.length);

    if (HAS_EMBEDDINGS) {
      try {
        const embJson = JSON.stringify(EMBEDDINGS);
        const compressedEmb = window.LZString ? LZString.compressToUTF16(embJson) : embJson;
        localStorage.setItem(EMB_CACHE_KEY, compressedEmb);
      } catch (e) { console.warn("⚠ 임베딩 캐시 저장 실패:", e.message); }
    }
    
    hideLoadingMessage();
    setStatus(`✓ 준비 완료 (${CHUNKS.length}개)`, "ok");
    
  } catch (e) {
    console.error(e);
    hideLoadingMessage();
    setStatus("연결 실패", "err");
    showError(`초기화 실패: ${e.message}`);
  }
}

let _lastAnswer = "";

function copyAnswer() {
  if (!_lastAnswer) return;
  const copyBtn = document.getElementById("copyBtn");
  const copyText = document.getElementById("copyBtnText");
  const copyIcon = document.getElementById("copyBtnIcon");
  const aiContent = document.getElementById("aiContent");
  const wrappedHtml = `<div style="font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;color:#1a1f36;">${aiContent.innerHTML}</div>`;
  const plainText = markdownToPlainText(_lastAnswer);

  if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
    try {
      const item = new ClipboardItem({
        "text/html": new Blob([wrappedHtml], { type: "text/html" }),
        "text/plain": new Blob([plainText], { type: "text/plain" })
      });
      navigator.clipboard.write([item]).then(showCopySuccess).catch(() => {
        navigator.clipboard.writeText(plainText).then(showCopySuccess).catch(() => fallbackCopyRich(wrappedHtml, plainText));
      });
      return;
    } catch (_e) {}
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plainText).then(showCopySuccess).catch(() => fallbackCopyRich(wrappedHtml, plainText));
  } else {
    fallbackCopyRich(wrappedHtml, plainText);
  }

  function showCopySuccess() {
    copyBtn.classList.add("copied");
    copyIcon.textContent = "✓";
    copyText.textContent = "복사됨!";
    setTimeout(() => {
      copyBtn.classList.remove("copied");
      copyIcon.textContent = "📋";
      copyText.textContent = "복사";
    }, 2000);
  }

  function fallbackCopyRich(html, text) {
    const div = document.createElement("div");
    div.contentEditable = "true";
    div.innerHTML = html;
    div.style.position = "fixed"; div.style.top = "-9999px"; div.style.opacity = "0";
    document.body.appendChild(div);
    const range = document.createRange();
    range.selectNodeContents(div);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    try {
      document.execCommand("copy");
      showCopySuccess();
    } catch (_e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showCopySuccess();
      } catch (_e2) { alert("복사 실패."); }
    }
    sel.removeAllRanges();
    document.body.removeChild(div);
  }
}

function markdownToPlainText(md) {
  if (!md) return "";
  let text = md;
  text = text.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const dataLines = [lines[0], ...lines.slice(2)];
    const rows = dataLines.map(line => {
      const cells = line.split("|");
      if (cells.length > 0 && !cells[0].trim()) cells.shift();
      if (cells.length > 0 && !cells[cells.length - 1].trim()) cells.pop();
      return cells.map(c => c.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").trim());
    });
    const widths = [];
    rows.forEach(r => r.forEach((c, i) => { widths[i] = Math.max(widths[i] || 0, [...c].length); }));
    const formatted = rows.map(r => r.map((c, i) => c + " ".repeat(Math.max(0, widths[i] - [...c].length))).join("  │  "));
    const sep = widths.map(w => "─".repeat(w)).join("──┼──");
    return "\n" + formatted[0] + "\n" + sep + "\n" + formatted.slice(1).join("\n") + "\n";
  });
  text = text.replace(/^#{1,6}\s+/gm, "");
  text = text.replace(/\*\*(.+?)\*\*/g, "$1");
  text = text.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, "$1");
  text = text.replace(/`([^`]+)`/g, "$1");
  text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
  text = text.replace(/\n{3,}/g, "\n\n");
  return text.trim();
}

async function searchSemantic(query, topK) {
  const queryEmb = await embedQuery(query);
  const scored = [];
  for (const chunk of CHUNKS) {
    const emb = EMBEDDINGS[chunk.id];
    if (!emb) continue;
    scored.push({ chunk, score: cosineSim(queryEmb, emb) });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

async function embedQuery(text) {
  if (!GEMINI_KEY) throw new Error("Gemini API 키가 등록되지 않았습니다.");
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent?key=${GEMINI_KEY}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "models/gemini-embedding-001",
      content: { parts: [{ text }] },
      taskType: "RETRIEVAL_QUERY"
    })
  });
  if (!res.ok) {
    const err = await res.text();
    if (res.status === 429) throw new Error("임베딩 quota 초과.");
    if (res.status === 400 || res.status === 403) throw new Error(`Gemini 키 문제 (${res.status}).`);
    throw new Error(`임베딩 오류 (${res.status}): ${err.slice(0, 100)}`);
  }
  const data = await res.json();
  return data.embedding.values;
}

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i];
  }
  return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-10);
}

function searchKeyword(query, topK) {
  const tokens = query.toLowerCase().split(/[\s,.\?!()[\]{}'":;~`!@#$%^&*+=<>\/\\|]+/).filter(t => t.length >= 2);
  if (tokens.length === 0) return [];
  const scored = [];
  for (const chunk of CHUNKS) {
    const text = (chunk.search_text || "").toLowerCase();
    let score = 0;
    for (const token of tokens) {
      const re = new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
      const matches = text.match(re);
      if (matches) {
        score += matches.length * Math.min(token.length / 2, 3);
        if ((chunk.title || "").toLowerCase().includes(token)) score += 5;
      }
    }
    if (score > 0) scored.push({ chunk, score: score / 50 });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

async function generateAnswer(query, topChunks) {
  const cacheKey = "ans_" + simpleHash(query.toLowerCase().trim());
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const obj = JSON.parse(cached);
      if (Date.now() - obj.ts < 24 * 60 * 60 * 1000) {
        const cleaned = postProcessKorean(obj.answer);
        if (cleaned !== obj.answer) cacheAnswer(cacheKey, cleaned);
        return cleaned + "\n\n*(이전 답변 캐시 사용 · API 호출 0회)*";
      }
    }
  } catch (e) {}
  
  const context = topChunks.map((x, i) => {
    const c = x.chunk;
    const body = c.content || c.search_text || "";
    const trimmed = body.slice(0, 800);
    if (c.content) return `[자료${i+1}] ${c.source}/${c.category || ""}\n${c.title}\n${trimmed}`;
    else return `[자료${i+1}] ${c.source}/${c.category || ""}\n${trimmed}`;
  }).join("\n---\n");
  
  const userMsg = `[참고 자료]\n${context}\n\n[질문]\n${query}\n\n위 자료만 근거로 답변. 반드시 한국어, HTML 태그 금지, markdown만.`;
  
  if (!GROQ_KEY) throw new Error("Groq API 키가 등록되지 않았습니다.");
  
  const answer = await callGroq(userMsg);
  cacheAnswer(cacheKey, answer);
  return answer;
}

async function callGroq(userMsg, retryCount = 0) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: userMsg }
      ],
      max_tokens: 2048, temperature: 0.2
    })
  });
  if (!res.ok) {
    const errText = await res.text();
    if (res.status === 429 && retryCount < 1) {
      let waitSec = parseFloat(res.headers.get("retry-after") || "0");
      if (!waitSec || waitSec < 0.5) {
        const m = errText.match(/try again in ([\d.]+)\s*s/i);
        waitSec = m ? parseFloat(m[1]) : 0;
      }
      waitSec = Math.max(5, Math.min(60, waitSec || 12));
      try { showLoadingMessage(`잠시만요... API 한도로 ${Math.ceil(waitSec)}초 대기 중`); } catch (_e) {}
      await new Promise(r => setTimeout(r, Math.round(waitSec * 1000)));
      return callGroq(userMsg, retryCount + 1);
    }
    if (res.status === 429) throw new Error("일시적으로 API 사용량이 많습니다.");
    throw new Error(`Groq 오류 (${res.status}): ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  if (!data.choices || !data.choices[0]) throw new Error("Groq 응답이 비어있습니다");
  return postProcessKorean(data.choices[0].message.content);
}

// 답변 후처리: HTML → markdown 변환 + 외국어 → 한국어
function postProcessKorean(text) {
  if (!text) return text;
  let result = text;

  // ★★ 0단계 — 같은 줄 헤더: "지원 기준<ul>..." → "**지원 기준**\n\n<ul>..."
  result = result.replace(/([^\n*><][^\n<>]{0,29}?)(<(?:ul|ol|table)[^>]*>)/gi, (m, header, tag) => {
    const trimmed = header.trim();
    if (!trimmed) return m;
    if (/^\*\*.+\*\*$/.test(trimmed)) return m;
    if (/[<>]/.test(trimmed)) return m;
    return `\n\n**${trimmed}**\n\n${tag}`;
  });

  // ★★ 0-2단계 — 줄바꿈 분리 헤더: "오류 해결 방법\n<ul>..." → "**오류 해결 방법**\n\n<ul>..."
  result = result.replace(/(^|\n)([^\n*<>][^\n<>]{0,29})\n(<(?:ul|ol|table)[^>]*>)/g, (m, lead, header, tag) => {
    const trimmed = header.trim();
    if (!trimmed) return m;
    if (/^\*\*.+\*\*$/.test(trimmed)) return m;
    if (/[<>]/.test(trimmed)) return m;
    if (/^📎/.test(trimmed)) return m;
    return `${lead}**${trimmed}**\n\n${tag}`;
  });

  // 강조 태그
  result = result.replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**');
  result = result.replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, '**$1**');
  result = result.replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*');
  result = result.replace(/<i[^>]*>([\s\S]*?)<\/i>/gi, '*$1*');

  // 표 변환 — 앞뒤에 \n\n 보장 (renderMarkdown의 paragraph 분할이 정상 작동하도록)
  result = result.replace(/<table[^>]*>([\s\S]*?)<\/table>/gi, (match, content) => {
    let headerRow = '';
    const theadMatch = content.match(/<thead[^>]*>([\s\S]*?)<\/thead>/i);
    if (theadMatch) {
      const headerCells = theadMatch[1].match(/<th[^>]*>([\s\S]*?)<\/th>/gi) || [];
      const headers = headerCells.map(c => c.replace(/<[^>]*>/g, '').trim());
      if (headers.length > 0) {
        headerRow = '| ' + headers.join(' | ') + ' |\n';
        headerRow += '|' + headers.map(() => '------').join('|') + '|\n';
      }
    }
    const bodyContent = content.replace(/<thead[^>]*>[\s\S]*?<\/thead>/i, '');
    const rows = bodyContent.match(/<tr[^>]*>([\s\S]*?)<\/tr>/gi) || [];
    const bodyRows = rows.map(row => {
      const cells = row.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi) || [];
      const cellTexts = cells.map(c => c.replace(/<[^>]*>/g, '').trim());
      return '| ' + cellTexts.join(' | ') + ' |';
    }).join('\n');
    return '\n\n' + headerRow + bodyRows + '\n\n';
  });

  // 목록 변환 — 앞뒤에 \n\n 보장 (헤더와 paragraph 분리 위함)
  result = result.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n\n' + items.map(item => '- ' + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n\n';
  });
  result = result.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n\n' + items.map((item, i) => `${i+1}. ` + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n\n';
  });
  result = result.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, '\n- $1');
  result = result.replace(/<br\s*\/?>/gi, '\n');
  result = result.replace(/<\/?p[^>]*>/gi, '\n');

  // ★★★ 최종 안전망: 남은 HTML 태그 반복 제거
  for (let i = 0; i < 3; i++) {
    const before = result;
    result = result.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^<>]*?)?\/?>/g, '');
    if (before === result) break;
  }
  result = result.replace(/&lt;\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^&]*?)?&gt;/g, '');
  result = result.replace(/&nbsp;/g, ' ');

  // 일본어/영어 → 한국어
  const jpReplacements = [
    [/ただし[、,]?\s*/g, '다만, '], [/しかし[、,]?\s*/g, '하지만, '],
    [/また[、,]?\s*/g, '또한, '], [/および/g, '및'],
    [/なお[、,]?\s*/g, '참고로, '], [/さらに[、,]?\s*/g, '추가로, '],
    [/つまり[、,]?\s*/g, '즉, '], [/もしくは/g, '또는'],
    [/その他/g, '기타'], [/について/g, '에 대해'],
  ];
  const enReplacements = [
    [/\bHowever,\s*/g, '하지만, '], [/\bhowever,\s*/g, '하지만, '],
    [/\bHowever\b/g, '하지만'], [/\bMoreover,\s*/g, '또한, '],
    [/\bAdditionally,\s*/g, '추가로, '], [/\bTherefore,\s*/g, '따라서, '],
    [/\bAlso,\s*/g, '또한, '], [/\bFor example,\s*/g, '예를 들어, '],
    [/\bThus,\s*/g, '따라서, '], [/\bAs a result,\s*/g, '그 결과, '],
  ];
  jpReplacements.forEach(([p, k]) => { result = result.replace(p, k); });
  enReplacements.forEach(([p, k]) => { result = result.replace(p, k); });
  
  result = result.replace(/\n{3,}/g, '\n\n');
  return result.trim();
}

function cacheAnswer(cacheKey, answer) {
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() }));
  } catch (e) {
    if (e && (e.name === "QuotaExceededError" || /quota/i.test(e.message || ""))) {
      cleanupOldAnswerCache(0.5);
      try { localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() })); } catch (e2) {}
    }
  }
}

function lzGet(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  if (!window.LZString) return raw;
  try {
    const decompressed = LZString.decompressFromUTF16(raw);
    if (decompressed && decompressed.length > 0 && (decompressed[0] === '[' || decompressed[0] === '{')) return decompressed;
    return (raw[0] === '[' || raw[0] === '{') ? raw : null;
  } catch (_e) {
    return (raw && (raw[0] === '[' || raw[0] === '{')) ? raw : null;
  }
}

function trySaveMetaCache(metaJson, metaKey, timeKey, countKey, chunkCount) {
  const setAll = () => {
    localStorage.setItem(metaKey, metaJson);
    localStorage.setItem(timeKey, String(Date.now()));
    localStorage.setItem(countKey, String(chunkCount));
  };
  try { setAll(); return true; } catch (e) { if (!isQuotaError(e)) return false; }
  cleanupOldAnswerCache(1.0);
  try { setAll(); return true; } catch (e) { if (!isQuotaError(e)) return false; }
  try {
    localStorage.removeItem("triplus_chunks_emb");
    setAll();
    return true;
  } catch (e) { return false; }
}

function isQuotaError(e) {
  return e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || /quota/i.test(e.message || ""));
}

function cleanupOldAnswerCache(ratio) {
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("ans_")) {
      try {
        const obj = JSON.parse(localStorage.getItem(k));
        items.push({ key: k, ts: (obj && obj.ts) || 0 });
      } catch (_e) { items.push({ key: k, ts: 0 }); }
    }
  }
  items.sort((a, b) => a.ts - b.ts);
  const removeCount = Math.max(1, Math.floor(items.length * ratio));
  let n = 0;
  for (let i = 0; i < removeCount && i < items.length; i++) {
    localStorage.removeItem(items[i].key); n++;
  }
  return n;
}

window.clearAnswerCache = function() {
  const n = cleanupOldAnswerCache(1.0);
  console.log(`✅ 답변 캐시 ${n}개 삭제. 페이지를 새로고침하세요.`);
  return n;
};

window.clearAllCache = function() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.startsWith("triplus_") || k.startsWith("ans_"))) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  console.log(`✅ 트리플러스 캐시 ${keys.length}개 삭제. 페이지를 새로고침하세요.`);
  return keys.length;
};

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}

// Markdown 렌더링
function renderMarkdown(md) {
  // ★ HTML 잔여물 가능성이 있으면 항상 postProcessKorean 통과 (조건 완화)
  if (md && /<[a-zA-Z]/.test(md)) md = postProcessKorean(md);
  let html = md;

  // markdown 표 → HTML — 앞뒤에 \n\n 보장
  html = html.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const header = lines[0].split("|").filter(c => c.trim()).map(c => `<th>${escapeHtml(c.trim())}</th>`).join("");
    const rows = lines.slice(2).map(line => {
      const cells = line.split("|").filter((c, i, a) => !(i === 0 && !c.trim()) && !(i === a.length - 1 && !c.trim()));
      return "<tr>" + cells.map(c => `<td>${renderInline(c.trim())}</td>`).join("") + "</tr>";
    }).join("");
    return `\n\n<table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>\n\n`;
  });
  // markdown 헤딩 → h3 — 앞뒤에 \n\n 보장
  html = html.replace(/^### (.+)$/gm, "\n\n<h3>$1</h3>\n\n");
  html = html.replace(/^## (.+)$/gm, "\n\n<h3>$1</h3>\n\n");
  // markdown 리스트 → ul — 앞뒤에 \n\n 보장 (헤더와 paragraph 분리 위해 핵심)
  html = html.replace(/(?:^- (.+)$\n?)+/gm, (m) => {
    const items = m.trim().split(/\n/).map(line => line.replace(/^- /, "").trim());
    return "\n\n<ul>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ul>\n\n";
  });
  // 여러 줄바꿈을 \n\n으로 정규화 후 split
  html = html.replace(/\n{3,}/g, '\n\n');
  html = html.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    // 블록 HTML 요소로 시작하면 그대로 (escape 안 함)
    if (p.match(/^<(h\d|ul|ol|table|pre|div)/i)) return p;
    return `<p>${renderInline(p)}</p>`;
  }).filter(Boolean).join("\n");
  return html;
}

function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\n/g, "<br>");
  return text;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderSources(topChunks) {
  const list = document.getElementById("sourcesList");
  list.innerHTML = topChunks.map((x, i) => {
    const c = x.chunk;
    const tagClass = getTagClass(c.source);
    const tagLabel = (c.source || "").split("/")[0];
    const score = `${(x.score * 100).toFixed(0)}%`;
    return `<div class="source-card" onclick="toggleSource(${i})">
      <div class="source-card-hdr">
        <span class="source-tag ${tagClass}">${escapeHtml(tagLabel)}</span>
        <span class="source-title">${escapeHtml((c.title || "").slice(0, 80))}</span>
        <span class="source-score">${score}</span>
      </div>
      <div class="source-body">${escapeHtml(c.content || "")}</div>
    </div>`;
  }).join("");
}

function getTagClass(source) {
  if (!source) return "";
  if (source.startsWith("Q&A")) return "tag-qa";
  if (source.startsWith("매뉴얼")) return "tag-manual";
  if (source.includes("규정")) return "tag-rule";
  if (source.includes("구간")) return "tag-route";
  return "";
}

function toggleSource(i) {
  document.querySelectorAll(".source-card")[i].classList.toggle("open");
}

function showError(msg) {
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  document.getElementById("sourcesSection").style.display = "none";
  aiBox.classList.add("on");
  aiContent.innerHTML = `<div class="info-msg">${msg}</div>`;
}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

init();
</script>
