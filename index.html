@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 200; }
.logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.logo-text { font-size: 15px; font-weight: 700; }

.status-warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }
.status-err { background: rgba(220, 38, 38, 0.12); color: var(--accent3); border: 1px solid rgba(220, 38, 38, 0.3); }

.main { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
.welcome { text-align: center; padding: 40px 20px; }

.welcome p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

.search-box { display: flex; gap: 10px; margin-bottom: 16px; }
.search-input-wrap { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; transition: all 0.2s; }
.search-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
.si-icon { color: var(--text3); margin-right: 12px; font-size: 16px; }
.search-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; padding: 16px 0; }
.search-input::placeholder { color: var(--text3); }
.clear-btn { background: var(--surface2); color: var(--text2); border: none; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; margin-left: 8px; transition: all 0.15s; padding: 0; line-height: 1; }
.clear-btn:hover { background: #ef4444; color: #fff; }
.clear-btn.show { display: flex; }
.search-btn { background: var(--accent); color: #fff; border: none; cursor: pointer; border-radius: 12px; padding: 0 24px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; transition: all 0.15s; white-space: nowrap; min-width: 90px; }
.search-btn:hover { background: #1d4ed8; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
.chips-label { font-size: 12px; color: var(--text3); margin-right: 4px; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
.chip:hover { border-color: var(--accent2); color: var(--accent2); }

.ai-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 24px 28px; margin-bottom: 24px; display: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
.ai-box.on { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ai-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.ai-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.05em; }
.ai-sub { font-size: 13px; color: var(--text2); flex: 1; }

.ai-content th { background: var(--surface2); font-weight: 600; }

.spinner { width: 18px; height: 18px; border: 2.5px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

.source-tag.tag-qa { background: var(--accent2); }

.source-score { margin-left: auto; font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }
.source-title { font-weight: 500; color: var(--text); font-size: 13px; }
.source-body { font-size: 12px; color: var(--text2); margin-top: 6px; display: none; white-space: pre-wrap; padding: 8px; background: var(--surface); border-radius: 6px; max-height: 200px; overflow-y: auto; }
.source-card.open .source-body { display: block; }

.error-msg { background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.3); color: var(--accent3); padding: 14px 18px; border-radius: 8px; font-size: 13px; }
.info-msg { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; padding: 14px 18px; border-radius: 8px; font-size: 13px; line-height: 1.7; }

@media (max-width: 640px) {
  header { padding: 12px 16px; }
  .main { padding: 20px 16px 60px; }
  .ai-box { padding: 18px 20px; }
  .search-box { flex-direction: column; }
  .search-btn { padding: 14px; }
}

<div class="main">

    <span class="chip" onclick="setQ('숙박비 한도가 어떻게 되나요?')">숙박비 한도</span>
    <span class="chip" onclick="setQ('출장 4주 미정산 시 어떻게 되나요?')">4주 자동회수</span>
    <span class="chip" onclick="setQ('하이패스 스크래핑 모듈 설치 오류 해결 방법?')">하이패스 오류</span>

};

// 시스템 프롬프트 (6가지 원칙 + 유의사항 섹션 포함)
const SYSTEM_PROMPT = `당신은 현대자동차 트리플러스(TRIP+) 출장관리 Q&A 도우미입니다. 제공된 자료만 근거로 답변하며, 없는 내용은 추측하지 마세요.

⚠️ 언어 규칙:
- 반드시 한국어로만 답변
- 외국어 단어 사용 금지 (다만, 하지만, 또한 등 한국어 사용)

⚠️ 형식 규칙 (절대 준수):
- HTML 태그 절대 사용 금지: <ul>, <li>, <table>, <tr>, <td>, <th>, <thead>, <tbody>, <br>, <p>, <div>, <span> 등 모든 HTML 태그 X
- 표는 반드시 markdown 형식만 사용: | 컬럼1 | 컬럼2 | 형태
- 목록은 반드시 markdown 형식만 사용: - 항목 또는 1. 항목
- 마크다운 헤더(##, ###) 사용 금지 → 굵은 글씨(**)로 섹션 제목 표현

📋 답변 작성 6가지 원칙 (반드시 준수):

1. 결론 먼저, 근거는 그 다음
   - 첫 1-2문장으로 결론을 명확히 제시
   - 결론 뒤에 충분한 근거/세부 정보

2. 인사말, 감정 표현, "도움이 되셨길 바랍니다" 류 절대 제외
   - "안녕하세요", "감사합니다" X
   - 사과 표현 X

3. 문장은 짧게 끊고 최대한 bullet로 변환
   - 긴 문단보다 짧은 문장 + bullet 선호
   - 1 bullet = 1-3문장

4. 비교 가능한 정보는 반드시 표로 정리
   - 직급별, 지역별, 등급별, 카테고리별 비교
   - 표 컬럼은 핵심만 (3-5개)

5. 굵은 글씨(**)는 핵심 키워드와 결론에만 사용
   - 섹션 제목 (필수)
   - 항목명 (필수)
   - 핵심 키워드 (선택, 남용 금지)

6. 단순 잡담/창작 요청에는 이 구조를 적용하지 않음 (업무 질의에만 적용)
   - 잡담은 "트리플러스 도우미입니다..." 한 줄로만 응답

📋 답변 구조 (질문 성격에 따라 필요한 섹션만 사용):

**[필수]** 결론 (1-2문장)
**[권장]** 근거/원리 - 왜 그런지 설명
**[권장]** 세부 기준 - 표 또는 항목 (비교 정보일 때 표 필수)
**[권장]** 절차/조치 방법 - 해야 할 일
**[필수]** 유의사항 - 자료에 명시된 예외/제한/주의점 (자료에 있으면 반드시 포함!)
**[필수]** 📎 출처

⚠️ 유의사항 섹션 중요:
- 자료에 예외 케이스, 제한 사항, 주의할 점, 함정이 명시되어 있다면 반드시 "**유의사항**" 섹션으로 별도 정리
- 자료에 명시된 모든 주의점을 누락 없이 포함
- 표시 형식: "**유의사항**" 섹션 아래 bullet 또는 "**항목명**: 설명" 형식

📏 답변 길이:
- 단순 질문: 10-20줄
- 복잡한 정책 질문: 20-40줄  
- 자료 부족: 2-5줄
- 잡담: 1줄 안내만

업무 외 질문 (잡담, 창작):
"현대자동차 트리플러스(TRIP+) 출장관리 Q&A 도우미입니다. 출장 규정, 정산 방법, 시스템 사용법에 대해 문의해주세요." 한 줄로만.

📚 답변 예시 (이 형식을 따라야 함):

[예시 1: 정책 + 예외 질문]
질문: 성남 정자역, 용인 구성역 출장비 청구 가능한가요?
답변: 성남(정자역)과 용인(구성역)은 남양연구소 기준 예외 허용 구간에 해당하므로 출장비 청구가 가능합니다.

**청구 가능 근거**

- **성남·용인 예외 인정**: 현대자동차 출장 규정상 남양연구소 소속 직원은 성남시(판교 포함) 및 용인시(마북 포함) 구간에 대해 50km 미만이더라도 국내출장비(일비 및 교통비)를 지원받을 수 있습니다.
- **목적지 입력 기준**: 시스템상 특정 역 이름(정자역, 구성역)으로 검색하면 예외 구간으로 인식되지 않을 수 있습니다.

**남양연구소 주요 예외 허용 구간**

| 목적지(지역) | 출장 인정 | 권장 입력 방법 | 지원 항목 |
|--------------|-----------|----------------|-----------|
| 성남 (정자역 등) | 인정 | [협력사] 성남 또는 판교(성남) | 일비 + 교통비 |
| 용인 (구성역 등) | 인정 | [협력사] 용인 | 일비 + 교통비 |
| 서울 전 지역 | 인정 | [서울지역] | 일비 + 교통비 |
| 의왕연구소 | 인정 | [사업장] 의왕연구소 | 교통비만 지원 |

**정산 시 조치 방법**

- **이동경로 수정**: 출장정산서의 목적지를 상세 주소가 아닌 지역명(성남, 용인)으로 재설정해야 합니다.
- **기타교통수단 선택**: 대중교통 이용 시 이동수단을 기타교통수단으로 선택하면 별도 증빙 없이 정액 요금이 자동 산출됩니다.

**유의사항**

- **지역명 입력 필수**: 역 이름이 아닌 지역 카테고리([협력사] 성남 등)로 설정해야 정액 요금 활성화.
- **지급 기준 미달 팝업**: 지역명 입력 후에도 '지급 기준 미달' 팝업이 발생할 경우, 트리플러스가 아닌 사내 SAP를 통해 시내교통비로 별도 청구해야 합니다.

// 전역 변수
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let CHUNKS = [];
let EMBEDDINGS = {};
let GEMINI_KEY = "";
let GROQ_KEY = "";
let HAS_EMBEDDINGS = false;

// ====================================================
// 초기화
// ====================================================
async function init() {
  setStatus("연결 중...", "warn");
  
  try {
    // 1. config에서 API 키 가져오기 (Gemini + Groq)
    const configDoc = await db.collection("config").doc("public").get();
    if (!configDoc.exists) {
      setStatus("설정 필요", "err");
      showError("관리자가 아직 시스템을 초기화하지 않았습니다.<br>관리자 페이지에서 초기 설정을 완료해주세요.");
      return;
    }
    GEMINI_KEY = configDoc.data().gemini_api_key || "";
    GROQ_KEY = configDoc.data().groq_api_key || "";
    
    if (!GEMINI_KEY && !GROQ_KEY) {
      setStatus("API 키 없음", "err");
      showError("API 키가 설정되지 않았습니다.<br>관리자가 Gemini 또는 Groq 키를 등록해주세요.");
      return;
    }
    if (!GROQ_KEY) {
      console.warn("Groq 키 없음. Gemini 답변 생성 사용 (quota 제한 있음)");
    }
    
    // 2. 자료 로드 - 캐시 우선 사용 (Firebase reads 최소화)
    // 메타데이터와 임베딩을 분리 저장하여 localStorage 용량 문제 해결
    const META_CACHE_KEY = "triplus_chunks_meta";        // 가벼움 (수백 KB)
    const EMB_CACHE_KEY = "triplus_chunks_emb";          // 무거움 (수 MB)
    const CACHE_TIME_KEY = "triplus_chunks_cache_time";
    const CACHE_COUNT_KEY = "triplus_chunks_count";
    const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // 7일
    const CHECK_INTERVAL = 12 * 60 * 60 * 1000; // 12시간
    
    // 강제 새로고침 체크 (?refresh=1)
    const urlParams = new URLSearchParams(window.location.search);
    const forceRefresh = urlParams.get('refresh') === '1';
    
    const cachedMeta = localStorage.getItem(META_CACHE_KEY);
    const cacheTime = parseInt(localStorage.getItem(CACHE_TIME_KEY) || "0");
    const cacheAge = Date.now() - cacheTime;
    const isValid = !forceRefresh && cachedMeta && cacheAge < CACHE_MAX_AGE;
    
    if (isValid) {
      try {
        // 메타데이터 먼저 로드 (빠름!)
        CHUNKS = JSON.parse(cachedMeta);
        
        // 임베딩은 별도로 로드 시도 (실패해도 메타로 검색 가능)
        try {
          const cachedEmb = localStorage.getItem(EMB_CACHE_KEY);
          if (cachedEmb) {
            EMBEDDINGS = JSON.parse(cachedEmb);
          } else {
            EMBEDDINGS = {};
          }
        } catch (e) {
          EMBEDDINGS = {};
          console.warn("임베딩 캐시 로드 실패 (키워드 검색 모드):", e);
        }
        
        HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
        const ageHours = Math.round(cacheAge / 1000 / 60 / 60);
        console.log(`✓ 캐시 사용: ${CHUNKS.length}개 청크 (Firebase reads 0, ${ageHours}시간 전)`);
        setStatus(`✓ 준비 완료 (${CHUNKS.length}개, 캐시)`, "ok");
        
        // 백그라운드 변경 감지 (12시간 후만)
        if (cacheAge > CHECK_INTERVAL) {
          setTimeout(() => checkForUpdates(CHUNKS.length), 2000);
        }
        return;
      } catch (e) {
        console.warn("캐시 파싱 실패, 새로 로드:", e);
      }
    }
    
    // 3. Firestore에서 청크 로드 (캐시 없거나 만료)
    setStatus("자료 로드 중... (0%)", "warn");
    showLoadingMessage("자료 다운로드 중...");
    
    const snap = await db.collection("chunks").get();
    const totalDocs = snap.docs.length;
    
    setStatus(`자료 처리 중... (0/${totalDocs})`, "warn");
    showLoadingMessage(`자료 처리 중... (0/${totalDocs})`);
    
    CHUNKS = [];
    EMBEDDINGS = {};
    
    // 청크 단위로 처리 (UI 블로킹 방지)
    const BATCH_SIZE = 200;
    for (let i = 0; i < snap.docs.length; i += BATCH_SIZE) {
      const batch = snap.docs.slice(i, i + BATCH_SIZE);
      batch.forEach(doc => {
        const d = doc.data();
        CHUNKS.push({
          id: doc.id,
          source: d.source || "",
          category: d.category || "",
          title: d.title || "",
          content: d.content || "",
          search_text: d.search_text || ""
        });
        if (d.embedding && Array.isArray(d.embedding)) {
          EMBEDDINGS[doc.id] = d.embedding;
        }
      });
      
      const progress = Math.min(i + BATCH_SIZE, totalDocs);
      const percent = Math.round((progress / totalDocs) * 100);
      setStatus(`자료 처리 중... (${progress}/${totalDocs}, ${percent}%)`, "warn");
      showLoadingMessage(`자료 처리 중... (${progress}/${totalDocs})`);
      
      // UI 갱신 대기 (블로킹 방지)
      if (i + BATCH_SIZE < snap.docs.length) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
    
    // 4. 캐시 저장 (메타데이터 + 임베딩 분리)
    setStatus("캐시 저장 중...", "warn");
    showLoadingMessage("캐시 저장 중...");
    
    // 4-1. 메타데이터 저장 (가벼움, 거의 항상 성공)
    let metaSaved = false;
    try {
      localStorage.setItem(META_CACHE_KEY, JSON.stringify(CHUNKS));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
      localStorage.setItem(CACHE_COUNT_KEY, String(CHUNKS.length));
      metaSaved = true;
      console.log(`✓ 메타데이터 캐시 저장 (${CHUNKS.length}개)`);
    } catch (e) {
      console.error("❌ 메타데이터 캐시 저장 실패:", e.message);
    }
    
    // 4-2. 임베딩 저장 (무거움, 용량 초과 가능)
    if (HAS_EMBEDDINGS) {
      try {
        localStorage.setItem(EMB_CACHE_KEY, JSON.stringify(EMBEDDINGS));
        console.log(`✓ 임베딩 캐시 저장 (${Object.keys(EMBEDDINGS).length}개)`);
      } catch (e) {
        console.warn(`⚠ 임베딩 캐시 저장 실패 (용량 초과). 키워드 검색은 정상 작동:`, e.message);
        // 임베딩 저장 실패해도 검색은 가능 (메모리에는 있음)
        // 다음 방문 시는 임베딩 없이 키워드 검색만 가능
      }
    }
    
    if (metaSaved) {
      console.log(`✓ 다음 7일 동안 Firebase reads 0`);
    }
    
    hideLoadingMessage();
    setStatus(`✓ 준비 완료 (${CHUNKS.length}개)`, "ok");
    console.log(`✅ ${CHUNKS.length}개 청크, ${Object.keys(EMBEDDINGS).length}개 임베딩 로드됨`);
    
  } catch (e) {
    console.error(e);
    hideLoadingMessage();
    setStatus("연결 실패", "err");
    showError(`초기화 실패: ${e.message}<br>잠시 후 새로고침 해보세요.`);
  }
}

// ====================================================
// 백그라운드 자료 변경 감지 (Firebase reads 최소화)
// 캐시 사용 후 가장 최근 문서 1개만 확인 (1 read만)
// ====================================================
async function checkForUpdates(cachedCount) {
  try {
    // 자료 변경 감지: count() 시도, 실패 시 무시
    let serverCount = null;
    
    // 방법 1: count() (v9.6+ 지원)
    try {
      const countSnap = await db.collection("chunks").count().get();
      serverCount = countSnap.data().count;
    } catch (countErr) {
      // count() 안 되면 백그라운드 체크 그냥 패스
      console.log("자료 변경 감지 패스 (count 미지원)");
      return;
    }
    
    if (serverCount !== null && serverCount !== cachedCount) {
      console.log(`📥 자료 변경 감지: 캐시 ${cachedCount}개 → 서버 ${serverCount}개`);
      
      // 사용자에게 알림 (상태 배지 클릭 가능하게)
      const badge = document.getElementById("statusBadge");
      if (badge) {
        badge.textContent = `⚠ 자료 업데이트 (클릭하여 새로고침)`;
        badge.className = "status-badge status-warn";
        badge.style.cursor = "pointer";
        badge.title = "클릭 시 새 자료 가져오기";
        badge.onclick = () => {
          localStorage.removeItem("triplus_chunks_cache");
          localStorage.removeItem("triplus_chunks_cache_time");
          localStorage.removeItem("triplus_chunks_count");
          window.location.href = window.location.pathname + "?refresh=1";
        };
      }
    } else {
      console.log(`✓ 자료 최신 상태 (${serverCount}개)`);
    }
  } catch (e) {
    // 변경 감지 실패는 무시 (캐시 그대로 사용)
    console.warn("자료 변경 감지 실패:", e.message);
  }
}

(function setupClearBtn() {

    clearBtn.classList.remove("show");
    input.focus();
  });
  
  // Enter 키로 검색
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      doSearch();
    }
  });
})();

// 답변 복사 함수
let _lastAnswer = "";

function copyAnswer() {
  if (!_lastAnswer) return;
  
  const copyBtn = document.getElementById("copyBtn");
  const copyText = document.getElementById("copyBtnText");
  const copyIcon = document.getElementById("copyBtnIcon");
  
  // 클립보드 API 사용
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(_lastAnswer).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(_lastAnswer);
    });
  } else {
    fallbackCopy(_lastAnswer);
  }
  
  function showCopySuccess() {
    copyBtn.classList.add("copied");
    copyIcon.textContent = "✓";
    copyText.textContent = "복사됨!";
    setTimeout(() => {
      copyBtn.classList.remove("copied");
      copyIcon.textContent = "📋";
      copyText.textContent = "복사";
    }, 2000);
  }
  
  function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.top = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand("copy");
      showCopySuccess();
    } catch (e) {
      alert("복사 실패. 직접 선택해서 복사해주세요.");
    }
    document.body.removeChild(textarea);
  }
}

async function doSearch() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;
  
  if (CHUNKS.length === 0) {
    showError("자료가 로드되지 않았습니다. 페이지를 새로고침하세요.");
    return;
  }
  if (!GEMINI_KEY) {
    showError("API 키가 설정되지 않았습니다. 관리자에게 문의하세요.");
    return;
  }
  
  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  btn.textContent = "검색 중...";
  
  document.getElementById("welcome").style.display = "none";
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  const sourcesSection = document.getElementById("sourcesSection");
  aiBox.classList.add("on");
  sourcesSection.style.display = "none";
  aiContent.innerHTML = `<div class="ai-loading"><div class="spinner"></div>관련 자료 검색 중...</div>`;
  
  const startTime = Date.now();
  
  try {
    // 1. 관련 청크 검색
    let topChunks;
    if (HAS_EMBEDDINGS) {
      document.getElementById("aiSub").textContent = "의미 검색 중...";
      topChunks = await searchSemantic(query, 5);
    } else {
      document.getElementById("aiSub").textContent = "키워드 검색 중...";
      topChunks = searchKeyword(query, 5);
    }
    
    if (topChunks.length === 0) {
      aiContent.innerHTML = `<div class="error-msg">관련 자료를 찾을 수 없습니다. 다른 키워드로 시도해보세요.</div>`;
      return;
    }
    
    // 2. AI 답변 생성
    aiContent.innerHTML = `<div class="ai-loading"><div class="spinner"></div>답변 생성 중...</div>`;
    document.getElementById("aiSub").textContent = "AI 답변 작성 중...";
    
    const answer = await generateAnswer(query, topChunks);
    
    // 답변 저장 (복사 버튼용)
    _lastAnswer = answer;
    
    // 3. 렌더링
    aiContent.innerHTML = renderMarkdown(answer);
    const elapsed = Date.now() - startTime;
    document.getElementById("aiSub").textContent = 
      `${HAS_EMBEDDINGS ? "의미 검색" : "키워드 검색"} · ${topChunks.length}개 자료 · ${elapsed}ms`;
    
    // 복사 버튼 표시
    document.getElementById("copyBtn").style.display = "flex";
    
    renderSources(topChunks);
    sourcesSection.style.display = "block";
    
    // 4. 로그 기록 (캐시 답변일 땐 스킵, write 절약)
    const isCached = answer.includes("이전 답변 캐시 사용");
    if (!isCached) {
      try {
        db.collection("search_logs").add({
          query: query.slice(0, 200),
          mode: HAS_EMBEDDINGS ? "semantic" : "keyword",
          result_count: topChunks.length,
          elapsed_ms: elapsed,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) { console.warn("로그 실패:", e); }
    }
    
  } catch (e) {
    console.error(e);
    aiContent.innerHTML = `<div class="error-msg">❌ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "AI 검색";
  }
}

// 의미 검색

async function searchSemantic(query, topK) {
  const queryEmb = await embedQuery(query);
  const scored = [];
  for (const chunk of CHUNKS) {
    const emb = EMBEDDINGS[chunk.id];
    if (!emb) continue;
    scored.push({ chunk, score: cosineSim(queryEmb, emb) });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

async function embedQuery(text) {
  if (!GEMINI_KEY) {
    throw new Error("Gemini API 키가 등록되지 않았습니다. 관리자가 Gemini 키를 Firestore에 등록해야 합니다.");
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent?key=${GEMINI_KEY}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "models/gemini-embedding-001",
      content: { parts: [{ text }] },
      taskType: "RETRIEVAL_QUERY"
    })
  });
  if (!res.ok) {
    const err = await res.text();
    if (res.status === 429) {
      throw new Error(`임베딩 quota 초과. 잠시 후 다시 시도하거나 관리자에게 Gemini 키 갱신을 문의하세요.`);
    }
    if (res.status === 400 || res.status === 403) {
      throw new Error(`Gemini 키 문제 (${res.status}). 관리자가 Firestore의 gemini_api_key를 새 키로 갱신해야 합니다.`);
    }
    throw new Error(`임베딩 오류 (${res.status}): ${err.slice(0, 100)}`);
  }
  const data = await res.json();
  return data.embedding.values;
}

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-10);
}

// ====================================================
// 키워드 검색 (fallback)
// ====================================================
function searchKeyword(query, topK) {
  const tokens = query.toLowerCase().split(/[\s,.\?!()[\]{}'":;~`!@#$%^&*+=<>\/\\|]+/).filter(t => t.length >= 2);
  if (tokens.length === 0) return [];
  
  const scored = [];
  for (const chunk of CHUNKS) {
    const text = (chunk.search_text || "").toLowerCase();
    let score = 0;
    for (const token of tokens) {
      const re = new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
      const matches = text.match(re);
      if (matches) {
        score += matches.length * Math.min(token.length / 2, 3);
        if ((chunk.title || "").toLowerCase().includes(token)) score += 5;
      }
    }
    if (score > 0) scored.push({ chunk, score: score / 50 });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

// ====================================================
// AI 답변 생성 (Groq 전용 - Gemini 폴백 없음)
// ====================================================
async function generateAnswer(query, topChunks) {
  // [캐싱] 동일 질문이면 캐시 반환 (quota 절약!)
  const cacheKey = "ans_" + simpleHash(query.toLowerCase().trim());
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const obj = JSON.parse(cached);
      // 24시간 이내 캐시면 사용
      if (Date.now() - obj.ts < 24 * 60 * 60 * 1000) {
        console.log("✓ 캐시된 답변 사용 (quota 절약)");
        return obj.answer + "\n\n*(이전 답변 캐시 사용 · API 호출 0회)*";
      }
    }
  } catch (e) { /* 캐시 실패는 무시 */ }
  
  // [토큰 절약] 자료 content 600자로 제한
  const context = topChunks.map((x, i) => {
    const c = x.chunk;
    const content = (c.content || "").slice(0, 1000);
    return `[자료${i+1}] ${c.source}/${c.category || ""}
${c.title}
${content}`;
  }).join("\n---\n");
  
  const userMsg = `[참고 자료]\n${context}\n\n[질문]\n${query}\n\n위 자료만 근거로 답변. 반드시 한국어로만 답변하고 다른 언어 단어 사용 금지. HTML 태그 사용 금지, markdown만 사용.\n\n답변 구조: 결론(1-2문장) → 근거/세부기준(표 활용) → 절차/조치 → **유의사항** 섹션은 자료에 예외/제한/주의점이 있다면 반드시 포함 → 📎 출처.\n\n6가지 원칙: 결론 먼저, 인사말 X, 짧은 문장+bullet, 비교는 표, 굵은 글씨는 핵심에만, 잡담 X.`;
  
  // ★ Groq 사용 (Gemini 폴백 없음 - quota 부담 X)
  if (!GROQ_KEY) {
    throw new Error("Groq API 키가 등록되지 않았습니다. 관리자에게 문의하세요.");
  }
  
  const answer = await callGroq(userMsg);
  cacheAnswer(cacheKey, answer);
  return answer;
}

// Groq API 호출 (Llama 3.3 70B - 한국어 좋음)
async function callGroq(userMsg) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${GROQ_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: userMsg }
      ],
      max_tokens: 2048,
      temperature: 0.2
    })
  });
  
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Groq 오류 (${res.status}): ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  if (!data.choices || !data.choices[0]) throw new Error("Groq 응답이 비어있습니다");
  return postProcessKorean(data.choices[0].message.content);
}

// 답변 후처리: 외국어 단어 → 한국어 자동 변환
function postProcessKorean(text) {
  if (!text) return text;
  let result = text;
  
  // ★ HTML 태그 → markdown 자동 변환 (LLM이 HTML로 답변한 경우)
  // 표 변환 (<table>...<tbody>...</table> → markdown 표)
  result = result.replace(/<table[^>]*>([\s\S]*?)<\/table>/gi, (match, content) => {
    // thead 추출
    let headerRow = '';
    const theadMatch = content.match(/<thead[^>]*>([\s\S]*?)<\/thead>/i);
    if (theadMatch) {
      const headerCells = theadMatch[1].match(/<th[^>]*>([\s\S]*?)<\/th>/gi) || [];
      const headers = headerCells.map(c => c.replace(/<[^>]*>/g, '').trim());
      if (headers.length > 0) {
        headerRow = '| ' + headers.join(' | ') + ' |\n';
        headerRow += '|' + headers.map(() => '------').join('|') + '|\n';
      }
    }
    
    // tbody (또는 직접 tr) 추출
    const bodyContent = content.replace(/<thead[^>]*>[\s\S]*?<\/thead>/i, '');
    const rows = bodyContent.match(/<tr[^>]*>([\s\S]*?)<\/tr>/gi) || [];
    const bodyRows = rows.map(row => {
      const cells = row.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi) || [];
      const cellTexts = cells.map(c => c.replace(/<[^>]*>/g, '').trim());
      return '| ' + cellTexts.join(' | ') + ' |';
    }).join('\n');
    
    return '\n' + headerRow + bodyRows + '\n';
  });
  
  // 목록 변환 (<ul>...<li>...</li>...</ul> → - 항목)
  result = result.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n' + items.map(item => '- ' + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n';
  });
  
  result = result.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n' + items.map((item, i) => `${i+1}. ` + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n';
  });
  
  // 단독 li 변환 (목록 컨테이너 밖에 있는 경우)
  result = result.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, '\n- $1');
  
  // 줄바꿈 태그
  result = result.replace(/<br\s*\/?>/gi, '\n');
  result = result.replace(/<\/?p[^>]*>/gi, '\n');
  
  // 강조 태그
  result = result.replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**');
  result = result.replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, '**$1**');
  result = result.replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*');
  
  // 남은 HTML 태그 모두 제거 (안전)
  result = result.replace(/<\/?(?:div|span|tr|td|th|thead|tbody|tfoot|table|ul|ol|li|p|br|h[1-6])[^>]*>/gi, '');
  
  // 일본어 → 한국어 변환
  const jpReplacements = [
    [/ただし[、,]?\s*/g, '다만, '],
    [/しかし[、,]?\s*/g, '하지만, '],
    [/また[、,]?\s*/g, '또한, '],
    [/および/g, '및'],
    [/なお[、,]?\s*/g, '참고로, '],
    [/さらに[、,]?\s*/g, '추가로, '],
    [/ところで[、,]?\s*/g, '그런데, '],
    [/つまり[、,]?\s*/g, '즉, '],
    [/もしくは/g, '또는'],
    [/その他/g, '기타'],
    [/について/g, '에 대해'],
    [/に関して/g, '에 관해'],
  ];
  
  // 영어 연결어 → 한국어
  const enReplacements = [
    [/\bHowever,\s*/g, '하지만, '],
    [/\bhowever,\s*/g, '하지만, '],
    [/\bHowever\b/g, '하지만'],
    [/\bBut,\s*/g, '하지만, '],
    [/\bMoreover,\s*/g, '또한, '],
    [/\bFurthermore,\s*/g, '또한, '],
    [/\bAdditionally,\s*/g, '추가로, '],
    [/\bTherefore,\s*/g, '따라서, '],
    [/\bIn addition,\s*/g, '또한, '],
    [/\bAlso,\s*/g, '또한, '],
    [/\bFor example,\s*/g, '예를 들어, '],
    [/\bFor instance,\s*/g, '예를 들어, '],
    [/\bIn other words,\s*/g, '즉, '],
    [/\bThus,\s*/g, '따라서, '],
    [/\bHence,\s*/g, '따라서, '],
    [/\bMeanwhile,\s*/g, '한편, '],
    [/\bOn the other hand,\s*/g, '반면, '],
    [/\bIn conclusion,\s*/g, '결론적으로, '],
    [/\bAs a result,\s*/g, '그 결과, '],
  ];
  
  jpReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  enReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  
  // 일본어 문자가 남아있으면 콘솔 경고
  if (/[\u3040-\u309F\u30A0-\u30FF]/.test(result)) {
    console.warn("⚠ 답변에 일본어 문자가 남아있습니다:", result.match(/[\u3040-\u309F\u30A0-\u30FF]+/g));
  }
  
  // 여러 줄바꿈 정리
  result = result.replace(/\n{3,}/g, '\n\n');
  
  return result.trim();
}

// 답변 캐싱 헬퍼
function cacheAnswer(cacheKey, answer) {
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() }));
  } catch (e) { /* 캐시 저장 실패 무시 */ }
}

// 간단한 문자열 해시 (캐시 키용)
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}

// ====================================================
// Markdown 렌더링
// ====================================================
function renderMarkdown(md) {
  let html = md;
  // 표
  html = html.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const header = lines[0].split("|").filter(c => c.trim()).map(c => `<th>${escapeHtml(c.trim())}</th>`).join("");
    const rows = lines.slice(2).map(line => {
      const cells = line.split("|").filter((c, i, a) => !(i === 0 && !c.trim()) && !(i === a.length - 1 && !c.trim()));
      return "<tr>" + cells.map(c => `<td>${renderInline(c.trim())}</td>`).join("") + "</tr>";
    }).join("");
    return `<table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // 헤딩
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  // 리스트
  html = html.replace(/(?:^- (.+)$\n?)+/gm, (m) => {
    const items = m.trim().split(/\n/).map(line => line.replace(/^- /, "").trim());
    return "<ul>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ul>";
  });
  // 줄바꿈
  html = html.split(/\n\n+/).map(p => {
    if (p.match(/^<(h\d|ul|ol|table|pre)/)) return p;
    return `<p>${renderInline(p)}</p>`;
  }).join("");
  return html;
}

function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\n/g, "<br>");
  return text;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ====================================================
// 출처 렌더링
// ====================================================
function renderSources(topChunks) {
  const list = document.getElementById("sourcesList");
  list.innerHTML = topChunks.map((x, i) => {
    const c = x.chunk;
    const tagClass = getTagClass(c.source);
    const tagLabel = (c.source || "").split("/")[0];
    const score = `${(x.score * 100).toFixed(0)}%`;
    return `<div class="source-card" onclick="toggleSource(${i})">
      <div class="source-card-hdr">
        <span class="source-tag ${tagClass}">${escapeHtml(tagLabel)}</span>
        <span class="source-title">${escapeHtml((c.title || "").slice(0, 80))}</span>
        <span class="source-score">${score}</span>
      </div>
      <div class="source-body">${escapeHtml(c.content || "")}</div>
    </div>`;
  }).join("");
}

function getTagClass(source) {
  if (!source) return "";
  if (source.startsWith("Q&A")) return "tag-qa";
  if (source.startsWith("매뉴얼")) return "tag-manual";
  if (source.includes("규정")) return "tag-rule";
  if (source.includes("구간")) return "tag-route";
  return "";
}

function toggleSource(i) {
  document.querySelectorAll(".source-card")[i].classList.toggle("open");
}

function showError(msg) {
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  document.getElementById("sourcesSection").style.display = "none";
  aiBox.classList.add("on");
  aiContent.innerHTML = `<div class="info-msg">${msg}</div>`;
}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});
