<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #f0f4ff;
  --surface: #ffffff;
  --surface2: #e8eef8;
  --border: #d0d9ee;
  --accent: #2563eb;
  --accent2: #059669;
  --accent3: #dc2626;
  --text: #1a1f36;
  --text2: #4b5680;
  --text3: #94a3c0;
  --warn: #f59e0b;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 200; }
.logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.logo-text { font-size: 15px; font-weight: 700; }
.logo-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.hdr-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.status-badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 4px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
.status-ok { background: rgba(5, 150, 105, 0.12); color: var(--accent2); border: 1px solid rgba(5, 150, 105, 0.3); }
.status-warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }
.status-err { background: rgba(220, 38, 38, 0.12); color: var(--accent3); border: 1px solid rgba(220, 38, 38, 0.3); }

.main { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
.welcome { text-align: center; padding: 40px 20px; }
.welcome h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.welcome p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

.search-box { display: flex; gap: 10px; margin-bottom: 16px; }
.search-input-wrap { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; transition: all 0.2s; }
.search-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
.si-icon { color: var(--text3); margin-right: 12px; font-size: 16px; }
.search-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; padding: 16px 0; }
.search-input::placeholder { color: var(--text3); }
.clear-btn { background: var(--surface2); color: var(--text2); border: none; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; margin-left: 8px; transition: all 0.15s; padding: 0; line-height: 1; }
.clear-btn:hover { background: #ef4444; color: #fff; }
.clear-btn.show { display: flex; }
.search-btn { background: var(--accent); color: #fff; border: none; cursor: pointer; border-radius: 12px; padding: 0 24px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; transition: all 0.15s; white-space: nowrap; min-width: 90px; }
.search-btn:hover { background: #1d4ed8; }
.search-btn:disabled { background: var(--text3); cursor: not-allowed; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
.chips-label { font-size: 12px; color: var(--text3); margin-right: 4px; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
.chip:hover { border-color: var(--accent2); color: var(--accent2); }

.ai-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 24px 28px; margin-bottom: 24px; display: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
.ai-box.on { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ai-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.ai-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.05em; }
.ai-sub { font-size: 13px; color: var(--text2); flex: 1; }
.copy-btn { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); cursor: pointer; padding: 6px 12px; border-radius: 6px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { background: #dcfce7; color: #15803d; border-color: #86efac; }
.ai-content { font-size: 14.5px; line-height: 1.85; color: var(--text); }
.ai-content strong { color: var(--accent); font-weight: 700; }
.ai-content h3 { color: var(--accent); font-size: 14px; margin-top: 18px; margin-bottom: 8px; }
.ai-content p { margin: 8px 0 12px; }
.ai-content ul, .ai-content ol { margin: 8px 0 16px; padding-left: 22px; }
.ai-content li { margin-bottom: 4px; }
.ai-content table { border-collapse: collapse; margin: 12px 0 18px; width: 100%; font-size: 13.5px; }
.ai-content th, .ai-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.ai-content th { background: var(--surface2); font-weight: 600; }
.ai-content code { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

.ai-loading { display: flex; align-items: center; gap: 12px; color: var(--text2); font-size: 14px; padding: 12px 0; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sources-section { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); }
.sources-label { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
.source-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.source-card:hover { border-color: var(--accent); background: #fff; }
.source-card-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.source-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--accent); color: #fff; }
.source-tag.tag-qa { background: var(--accent2); }
.source-tag.tag-manual { background: var(--accent); }
.source-tag.tag-rule { background: #7c3aed; }
.source-tag.tag-route { background: #0891b2; }
.source-score { margin-left: auto; font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }
.source-title { font-weight: 500; color: var(--text); font-size: 13px; }
.source-body { font-size: 12px; color: var(--text2); margin-top: 6px; display: none; white-space: pre-wrap; padding: 8px; background: var(--surface); border-radius: 6px; max-height: 200px; overflow-y: auto; }
.source-card.open .source-body { display: block; }

.error-msg { background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.3); color: var(--accent3); padding: 14px 18px; border-radius: 8px; font-size: 13px; }
.info-msg { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #92400e; padding: 14px 18px; border-radius: 8px; font-size: 13px; line-height: 1.7; }

@media (max-width: 640px) {
  header { padding: 12px 16px; }
  .main { padding: 20px 16px 60px; }
  .ai-box { padding: 18px 20px; }
  .search-box { flex-direction: column; }
  .search-btn { padding: 14px; }
}
</style>
</head>

<header>
  <div class="logo-icon">✈</div>
  <div>
    <div class="logo-text">트리플러스 AI 검색</div>
    <div class="logo-sub">현대자동차 출장관리</div>
  </div>
  <div class="hdr-right">
    <span class="status-badge status-warn" id="statusBadge">로딩 중...</span>

</header>

<div class="main">
  
  <div class="welcome" id="welcome">
    <h1>무엇을 도와드릴까요?</h1>
    <p>출장 규정, 정산 방법 등 무엇이든 자연스럽게 질문하세요.</p>
  </div>

  <div class="search-box">
    <div class="search-input-wrap">
      <span class="si-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="예: 출장 끝나고 4주 동안 정산 못 했는데 어떻게 되나요?" autocomplete="off">
      <button class="clear-btn" id="clearBtn" type="button" title="입력 내용 지우기">✕</button>
    </div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()">AI 검색</button>
  </div>

  <div class="chips">
    <span class="chips-label">자주 묻는 질문:</span>
    <span class="chip" onclick="setQ('임원 일비는 얼마인가요?')">임원 일비</span>
    <span class="chip" onclick="setQ('숙박비 한도가 어떻게 되나요?')">숙박비 한도</span>
    <span class="chip" onclick="setQ('출장 4주 미정산 시 어떻게 되나요?')">4주 자동회수</span>
    <span class="chip" onclick="setQ('하이패스 스크래핑 모듈 설치 오류 해결 방법?')">하이패스 오류</span>
    <span class="chip" onclick="setQ('남양연구소에서 양재 본사까지 교통비?')">남양↔양재</span>
  </div>

  <div class="ai-box" id="aiBox">
    <div class="ai-hdr">
      <span class="ai-badge">AI 답변</span>
      <span class="ai-sub" id="aiSub">현대자동차 트리플러스 자료 기반</span>
      <button class="copy-btn" id="copyBtn" type="button" onclick="copyAnswer()" style="display:none;" title="답변 복사">
        <span id="copyBtnIcon">📋</span>
        <span id="copyBtnText">복사</span>
      </button>
    </div>
    <div class="ai-content" id="aiContent"></div>
    <div class="sources-section" id="sourcesSection" style="display:none;">
      <div class="sources-label">📎 참고 자료</div>
      <div id="sourcesList"></div>
    </div>
  </div>

</div>

// 시스템 프롬프트 (6가지 원칙 + 유의사항 섹션 포함)
const SYSTEM_PROMPT = `당신은 현대자동차 트리플러스(TRIP+) 출장관리 Q&A 도우미입니다. 제공된 자료만 근거로 답변하며, 없는 내용은 추측하지 마세요.

⚠️ 언어 규칙:
- 반드시 한국어로만 답변
- 외국어 단어 사용 금지 (다만, 하지만, 또한 등 한국어 사용)

⚠️ 형식 규칙 (절대 준수):
- HTML 태그 절대 사용 금지
- 표는 반드시 markdown 형식만 사용: | 컬럼1 | 컬럼2 | 형태
- 목록은 반드시 markdown 형식만 사용: - 항목 또는 1. 항목
- 마크다운 헤더(##, ###) 사용 금지 → **굵은 글씨**로 섹션 제목 표현

🚫 절대 금지 - HTML 태그 출력 (가장 중요):
- 어떤 경우에도 다음 태그 출력 금지: <ul>, <li>, <ol>, <table>, <thead>, <tbody>, <tr>, <td>, <th>, <strong>, <b>, <em>, <i>, <p>, <br>, <div>, <span>, <h1>~<h6>
- 섹션 헤더는 반드시 markdown으로 굵게 처리:
  - 잘못된 예: 지원 기준\\n<ul><li>...</li></ul>
  - 올바른 예: **지원 기준**\\n- ...
- 표는 반드시 markdown 파이프(|) 형식:
  - 잘못된 예: <table><tr><th>구분</th>...</tr></table>
  - 올바른 예: | 구분 | 값 |\\n| --- | --- |\\n| ... | ... |
- 모든 답변은 100% markdown만 사용. HTML 한 태그라도 섞이면 화면이 깨짐.

🚫 절대 금지 - 조항 번호 인용:
- "제○조", "제○장", "○항", "○호" 등 조항/장/항/호 번호 인용 절대 금지
- 본문에서도 "제8조에 따르면", "제13조 기준" 같은 표현 사용 금지
- 출처(📎)에도 조항 번호 표시 금지 → "📎 출장규정집" 처럼 자료명만
- 자료가 "제8조 ..." 같이 시작해도 답변에서는 조항 번호를 배제하고 내용만 풀어쓸 것

📋 답변 작성 핵심 원칙:

1. 결론을 한 문장으로 먼저 (1-2줄)
2. 그 뒤에 필요한 섹션을 **굵은 헤더 + 불릿** 패턴으로 정리
3. 불릿은 반드시 "**라벨**: 설명." 형식 (라벨 굵게, 콜론, 한 문장 설명, 마침표로 종결)
4. 비교 가능한 정보는 반드시 markdown 표로 (구분 / 케이스 컬럼)
5. 예외/주의점은 **유의사항** 섹션에 별도 정리 (마지막 섹션 또는 마지막 불릿)
6. 인사말, 사과, "도움이 되셨길 바랍니다" 류 모두 제외

📋 표준 답변 구조 (질문 성격에 따라 필요한 섹션만 사용):

[결론 한 문장]

**[섹션 헤더 1]**
- **라벨**: 설명.
- **라벨**: 설명.

**[비교 섹션 헤더]**
| 구분 | 케이스 A | 케이스 B |
| --- | --- | --- |
| ... | ... | ... |

**[절차/방법 섹션 헤더]**
- **라벨**: 설명.

**유의사항**
- **항목**: 주의점.

📎 [자료명]

📏 답변 길이 가이드:

▶ 단순 사실 질문 (3-8줄):
   - 예: "X는 얼마인가요?", "가능한가요?"
   - 구조: 결론 → (필요 시 표) → 📎 출처

▶ 일반 절차 질문 (10-20줄):
   - 예: "X 신청 방법은?"
   - 구조: 결론 → **섹션** + 불릿 → 유의사항 (자료에 있다면) → 📎 출처

▶ 복잡 정책/예외 질문 (20-40줄):
   - 예: "X 케이스에서 Y는 어떻게?"
   - 구조: 결론 → **기준 섹션** → **비교 표** → **방법 섹션** → **유의사항** → 📎 출처

▶ 자료 부족 (2-5줄):
   - 결론(자료 명시 없음) + 권장 조치 + 출처

▶ 잡담/업무 외 (1줄):
   - "트리플러스 도우미입니다..." 안내만

💡 핵심: 질문이 단순하면 답변도 단순하게! 모든 답변에 모든 섹션을 강제로 넣지 말 것.

업무 외 질문 (잡담, 창작):
"현대자동차 트리플러스(TRIP+) 출장관리 Q&A 도우미입니다. 출장 규정, 정산 방법, 시스템 사용법에 대해 문의해주세요." 한 줄로만.

📚 답변 예시 (이 형식을 반드시 따라야 함):

[예시 0: 단순 사실 질문]
질문: 숙박비 한도는 얼마인가요?
답변: 일반 직원은 1박 8만원 정액, 임원은 직급별로 차등 적용됩니다.

| 직급 구분 | 1박 한도 |
| --- | --- |
| 일반 직원 | 80,000원 (정액) |
| 상무·임원 대우 | 200,000원 |
| 전무 이상 | 300,000원 |
| 부사장 이상 | 한도 없음 (실비) |

📎 출장규정집

[예시 0-2: 단순 가능/불가 질문]
질문: 평일 출장 후 주말에 복귀해도 항공비 청구 가능한가요?
답변: 가능합니다. 평일 출장 후 주말 복귀편의 항공비는 구간별 1회에 한해 출장비로 청구할 수 있습니다.

📎 출장규정집

[예시 1: 정책 + 예외 - 구조화된 답변]
질문: 5/20(수)-22(금) 일정으로 제주도로 국내출장 다녀왔습니다. 출장 교통비 정산 시 왕복 비행기 결제 금액을 청구하려고 합니다. 이때 일요일 복귀편으로 항공권 결제한 경우도 지원 가능한지 문의드립니다.
답변: 일요일 복귀편 항공권 정산은 가능하지만, 해당 주말의 숙박비와 일비는 지급되지 않습니다.

**주말 복귀 정산 기준**

- **교통비 지원**: 평일 출장 후 주말(토/일)에 복귀하는 경우, 구간별 1회에 한해 복귀편 항공비 청구가 가능합니다.
- **지원 범위**: 실제 사용일이 출장 기간(5/22)과 다르더라도 항공료 실비는 인정됩니다.
- **미지원 항목**: 출장 공식 종료일(5/22) 이후 발생하는 주말의 숙박비와 일비는 전액 본인 부담입니다.
- **사전 공유**: 근태 및 사고 예방을 위해 조직장(팀장)에게 사전 보고가 완료되어야 합니다.

**복귀 시점별 정산 범위 비교**

| 구분 | 금요일 복귀 (원칙) | 일요일 복귀 (사용자 케이스) |
| --- | --- | --- |
| 항공료 | 전액 실비 지원 | 실비 지원 가능 (구간당 1회) |
| 일비 | 5/22(금)까지 지급 | 5/22(금)까지만 지급 (주말 제외) |
| 숙박비 | 5/21(목) 숙박까지 지원 | 5/21(목) 숙박까지만 지원 (주말 제외) |

**청구 방법 및 필수 증빙**

- **청구 방식**: 트리플러스가 아닌 외부 사이트에서 예약한 경우, 정산서 작성 시 복귀 일자를 실제 탑승일(일요일)로 등록하여 청구하십시오.
- **필수 증빙 (2종)**:
  1. 항공 E-티켓 (결제 완료된 구매 영수증)
  2. 결제 영수증 (카드 승인번호 포함)
- **유의사항**: 좌석 번호가 적힌 탑승권은 증빙으로 인정되지 않으므로 반드시 E-티켓을 첨부해야 합니다.

📎 출장규정집

[예시 2: 직급별 기준 비교]
질문: 임원 숙박비는 얼마까지 지원되나요?
답변: 임원의 숙박비는 직급별로 상한이 다르게 적용되며, 일반 직원과 별도의 지급 체계로 운영됩니다.

**직급별 숙박비 한도**

| 직급 구분 | 지급 유형 | 1박 한도 | 비고 |
| --- | --- | --- | --- |
| 부사장 이상 | 실비 | 한도 없음 | 실비 전액 정산 |
| 전무 이상 | 실비 제한 | 300,000원 | 1박 기준 30만원 상한 |
| 상무·임원 대우 | 실비 제한 | 200,000원 | 1박 기준 20만원 상한 |
| 일반 직원 | 정액 | 80,000원 | 1박 기준 8만원 정액 지급 |

**적용 기준**

- **정산 방식**: 1박 단위로 정산되며 출장 기간 전체에 대해 적용.
- **증빙 요건**: 실비 정산 시 숙박 결제 영수증과 인보이스(또는 예약 내역) 제출 필수.

**유의사항**

- **한도 초과**: 임원 직급의 경우 한도 초과 금액은 지급되지 않으므로 예약 전 금액 확인 필요.
- **본인 부담**: 일반 직원이 1박 80,000원을 초과해 결제한 경우 초과 금액은 본인 부담.

**권장 조치**

- **인사팀 문의**: 외주직원 출장비 기준 직접 문의.
- **계약서 확인**: 외주 계약서에 출장비 관련 별도 조항이 있는지 확인.

// 전역 변수
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let CHUNKS = [];
let EMBEDDINGS = {};
let GEMINI_KEY = "";
let GROQ_KEY = "";
let HAS_EMBEDDINGS = false;

// ====================================================
// 초기화
// ====================================================
async function init() {
  setStatus("연결 중...", "warn");
  
  try {
    // 1. config에서 API 키 가져오기 (Gemini + Groq)
    const configDoc = await db.collection("config").doc("public").get();
    if (!configDoc.exists) {
      setStatus("설정 필요", "err");
      showError("관리자가 아직 시스템을 초기화하지 않았습니다.<br>관리자 페이지에서 초기 설정을 완료해주세요.");
      return;
    }
    GEMINI_KEY = configDoc.data().gemini_api_key || "";
    GROQ_KEY = configDoc.data().groq_api_key || "";
    
    if (!GEMINI_KEY && !GROQ_KEY) {
      setStatus("API 키 없음", "err");
      showError("API 키가 설정되지 않았습니다.<br>관리자가 Gemini 또는 Groq 키를 등록해주세요.");
      return;
    }
    if (!GROQ_KEY) {
      console.warn("Groq 키 없음. Gemini 답변 생성 사용 (quota 제한 있음)");
    }
    
    // 2. 자료 로드 - 캐시 우선 사용 (Firebase reads 최소화)
    // 메타데이터와 임베딩을 분리 저장하여 localStorage 용량 문제 해결
    const META_CACHE_KEY = "triplus_chunks_meta";        // 가벼움 (수백 KB)
    const EMB_CACHE_KEY = "triplus_chunks_emb";          // 무거움 (수 MB)
    const CACHE_TIME_KEY = "triplus_chunks_cache_time";
    const CACHE_COUNT_KEY = "triplus_chunks_count";
    const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // 7일
    const CHECK_INTERVAL = 12 * 60 * 60 * 1000; // 12시간
    
    // 강제 새로고침 체크 (?refresh=1)
    const urlParams = new URLSearchParams(window.location.search);
    const forceRefresh = urlParams.get('refresh') === '1';
    
    const cachedMeta = localStorage.getItem(META_CACHE_KEY);
    const cacheTime = parseInt(localStorage.getItem(CACHE_TIME_KEY) || "0");
    const cacheAge = Date.now() - cacheTime;
    const isValid = !forceRefresh && cachedMeta && cacheAge < CACHE_MAX_AGE;
    
    if (isValid) {
      try {
        // 메타데이터 먼저 로드 (빠름!)
        CHUNKS = JSON.parse(cachedMeta);
        
        // 임베딩은 별도로 로드 시도 (실패해도 메타로 검색 가능)
        try {
          const cachedEmb = localStorage.getItem(EMB_CACHE_KEY);
          if (cachedEmb) {
            EMBEDDINGS = JSON.parse(cachedEmb);
          } else {
            EMBEDDINGS = {};
          }
        } catch (e) {
          EMBEDDINGS = {};
          console.warn("임베딩 캐시 로드 실패 (키워드 검색 모드):", e);
        }
        
        HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
        const ageHours = Math.round(cacheAge / 1000 / 60 / 60);
        console.log(`✓ 캐시 사용: ${CHUNKS.length}개 청크 (Firebase reads 0, ${ageHours}시간 전)`);
        setStatus(`✓ 준비 완료 (${CHUNKS.length}개, 캐시)`, "ok");
        
        // 백그라운드 변경 감지 (12시간 후만)
        if (cacheAge > CHECK_INTERVAL) {
          setTimeout(() => checkForUpdates(CHUNKS.length), 2000);
        }
        return;
      } catch (e) {
        console.warn("캐시 파싱 실패, 새로 로드:", e);
      }
    }
    
    // 3. Firestore에서 청크 로드 (캐시 없거나 만료)
    setStatus("자료 로드 중... (0%)", "warn");
    showLoadingMessage("자료 다운로드 중...");
    
    const snap = await db.collection("chunks").get();
    const totalDocs = snap.docs.length;
    
    setStatus(`자료 처리 중... (0/${totalDocs})`, "warn");
    showLoadingMessage(`자료 처리 중... (0/${totalDocs})`);
    
    CHUNKS = [];
    EMBEDDINGS = {};
    
    // 청크 단위로 처리 (UI 블로킹 방지)
    const BATCH_SIZE = 200;
    for (let i = 0; i < snap.docs.length; i += BATCH_SIZE) {
      const batch = snap.docs.slice(i, i + BATCH_SIZE);
      batch.forEach(doc => {
        const d = doc.data();
        CHUNKS.push({
          id: doc.id,
          source: d.source || "",
          category: d.category || "",
          title: d.title || "",
          content: d.content || "",
          search_text: d.search_text || ""
        });
        if (d.embedding && Array.isArray(d.embedding)) {
          EMBEDDINGS[doc.id] = d.embedding;
        }
      });
      
      const progress = Math.min(i + BATCH_SIZE, totalDocs);
      const percent = Math.round((progress / totalDocs) * 100);
      setStatus(`자료 처리 중... (${progress}/${totalDocs}, ${percent}%)`, "warn");
      showLoadingMessage(`자료 처리 중... (${progress}/${totalDocs})`);
      
      // UI 갱신 대기 (블로킹 방지)
      if (i + BATCH_SIZE < snap.docs.length) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
    
    // 4. 캐시 저장 (메타데이터 + 임베딩 분리)
    setStatus("캐시 저장 중...", "warn");
    showLoadingMessage("캐시 저장 중...");
    
    // 4-1. 메타데이터 저장 (가벼움, 거의 항상 성공)
    // ★ content 필드는 캐시에서 제외 — search_text = title+content 이므로 정보 중복.
    //   검색 점수는 search_text로 매기고, LLM 컨텍스트도 search_text로 충분.
    //   메모리상 CHUNKS는 content를 그대로 유지 (이번 세션 동안만).
    let metaSaved = false;
    const slimChunks = CHUNKS.map(c => ({
      id: c.id,
      source: c.source,
      category: c.category,
      title: c.title,
      search_text: c.search_text || ((c.title || "") + "\n" + (c.content || ""))
      // content는 저장하지 않음 (용량 절약)
    }));
    const metaJson = JSON.stringify(slimChunks);
    console.log(`📦 메타 캐시 크기: ${(metaJson.length / 1024 / 1024).toFixed(2)} MB (${CHUNKS.length}개 청크, content 제외)`);
    metaSaved = trySaveMetaCache(metaJson, META_CACHE_KEY, CACHE_TIME_KEY, CACHE_COUNT_KEY, CHUNKS.length);
    
    // 4-2. 임베딩 저장 (무거움, 용량 초과 가능)
    if (HAS_EMBEDDINGS) {
      try {
        localStorage.setItem(EMB_CACHE_KEY, JSON.stringify(EMBEDDINGS));
        console.log(`✓ 임베딩 캐시 저장 (${Object.keys(EMBEDDINGS).length}개)`);
      } catch (e) {
        console.warn(`⚠ 임베딩 캐시 저장 실패 (용량 초과). 키워드 검색은 정상 작동:`, e.message);
        // 임베딩 저장 실패해도 검색은 가능 (메모리에는 있음)
        // 다음 방문 시는 임베딩 없이 키워드 검색만 가능
      }
    }
    
    if (metaSaved) {
      console.log(`✓ 다음 7일 동안 Firebase reads 0`);
    }
    
    hideLoadingMessage();
    setStatus(`✓ 준비 완료 (${CHUNKS.length}개)`, "ok");
    console.log(`✅ ${CHUNKS.length}개 청크, ${Object.keys(EMBEDDINGS).length}개 임베딩 로드됨`);
    
  } catch (e) {
    console.error(e);
    hideLoadingMessage();
    setStatus("연결 실패", "err");
    showError(`초기화 실패: ${e.message}<br>잠시 후 새로고침 해보세요.`);
  }
}

function setStatus(text, type) {
  const el = document.getElementById("statusBadge");
  el.textContent = text;
  el.className = "status-badge status-" + type;
}

// 로딩 메시지 표시 (화면 중앙)
function showLoadingMessage(text) {
  let loader = document.getElementById("initLoader");
  if (!loader) {
    loader = document.createElement("div");
    loader.id = "initLoader";
    loader.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px 32px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:9999;text-align:center;font-family:'Noto Sans KR',sans-serif;min-width:280px;border:1px solid #e2e8f0;";
    loader.innerHTML = `
      <div style="margin-bottom:12px;">
        <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
      </div>
      <div id="initLoaderText" style="color:#1e293b;font-size:14px;font-weight:500;">자료 로드 중...</div>
      <div style="color:#64748b;font-size:12px;margin-top:8px;">처음 접속 시 시간이 걸릴 수 있습니다</div>
    `;
    document.body.appendChild(loader);
    // 스피너 애니메이션 CSS 추가
    if (!document.getElementById("spinKeyframes")) {
      const style = document.createElement("style");
      style.id = "spinKeyframes";
      style.textContent = "@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }";
      document.head.appendChild(style);
    }
  }
  const textEl = document.getElementById("initLoaderText");
  if (textEl) textEl.textContent = text;
}

function hideLoadingMessage() {
  const loader = document.getElementById("initLoader");
  if (loader) {
    loader.style.opacity = "0";
    loader.style.transition = "opacity 0.3s";
    setTimeout(() => loader.remove(), 300);
  }
}

// ====================================================
// 백그라운드 자료 변경 감지 (Firebase reads 최소화)
// 캐시 사용 후 가장 최근 문서 1개만 확인 (1 read만)
// ====================================================
async function checkForUpdates(cachedCount) {
  try {
    // 자료 변경 감지: count() 시도, 실패 시 무시
    let serverCount = null;
    
    // 방법 1: count() (v9.6+ 지원)
    try {
      const countSnap = await db.collection("chunks").count().get();
      serverCount = countSnap.data().count;
    } catch (countErr) {
      // count() 안 되면 백그라운드 체크 그냥 패스
      console.log("자료 변경 감지 패스 (count 미지원)");
      return;
    }
    
    if (serverCount !== null && serverCount !== cachedCount) {
      console.log(`📥 자료 변경 감지: 캐시 ${cachedCount}개 → 서버 ${serverCount}개`);
      
      // 사용자에게 알림 (상태 배지 클릭 가능하게)
      const badge = document.getElementById("statusBadge");
      if (badge) {
        badge.textContent = `⚠ 자료 업데이트 (클릭하여 새로고침)`;
        badge.className = "status-badge status-warn";
        badge.style.cursor = "pointer";
        badge.title = "클릭 시 새 자료 가져오기";
        badge.onclick = () => {
          localStorage.removeItem("triplus_chunks_cache");
          localStorage.removeItem("triplus_chunks_cache_time");
          localStorage.removeItem("triplus_chunks_count");
          window.location.href = window.location.pathname + "?refresh=1";
        };
      }
    } else {
      console.log(`✓ 자료 최신 상태 (${serverCount}개)`);
    }
  } catch (e) {
    // 변경 감지 실패는 무시 (캐시 그대로 사용)
    console.warn("자료 변경 감지 실패:", e.message);
  }
}

// X 버튼 (입력 내용 지우기)
(function setupClearBtn() {
  const input = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn");
  if (!input || !clearBtn) return;
  
  // 입력 변화 감지 → X 버튼 표시/숨김
  function toggleClear() {
    if (input.value.length > 0) {
      clearBtn.classList.add("show");
    } else {
      clearBtn.classList.remove("show");
    }
  }
  
  input.addEventListener("input", toggleClear);
  input.addEventListener("change", toggleClear);
  
  // X 클릭 → 내용 삭제 + 포커스
  clearBtn.addEventListener("click", function() {
    input.value = "";
    clearBtn.classList.remove("show");
    input.focus();
  });
  
  // Enter 키로 검색
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      doSearch();
    }
  });
})();

function copyAnswer() {
  if (!_lastAnswer) return;

  const copyBtn = document.getElementById("copyBtn");
  const copyText = document.getElementById("copyBtnText");
  const copyIcon = document.getElementById("copyBtnIcon");

  // 1) HTML 버전: 화면에 그려진 답변 그대로 (Word/Slack/Notion 등 리치 텍스트 환경에서 서식 유지)

  // 복사용으로 깔끔하게 wrap (인라인 스타일 약간 부여 → 외부 앱 호환성↑)
  const wrappedHtml = `<div style="font-family:'Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;color:#1a1f36;">${aiContent.innerHTML}</div>`;

  // 2) Plain text 버전: markdown 기호 제거된 깔끔한 텍스트 (메모장 등 plain text 환경용)
  const plainText = markdownToPlainText(_lastAnswer);

  // ClipboardItem 지원 시 → HTML + plain text 둘 다 동시에 클립보드에
  if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
    try {
      const item = new ClipboardItem({
        "text/html": new Blob([wrappedHtml], { type: "text/html" }),
        "text/plain": new Blob([plainText], { type: "text/plain" })
      });
      navigator.clipboard.write([item]).then(showCopySuccess).catch(() => {
        // 폴백 1: writeText로 plain text만
        navigator.clipboard.writeText(plainText).then(showCopySuccess).catch(() => {
          fallbackCopyRich(wrappedHtml, plainText);
        });
      });
      return;
    } catch (_e) {
      // ClipboardItem 생성 실패 → 폴백
    }
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plainText).then(showCopySuccess).catch(() => {
      fallbackCopyRich(wrappedHtml, plainText);
    });
  } else {
    fallbackCopyRich(wrappedHtml, plainText);
  }

  function showCopySuccess() {
    copyBtn.classList.add("copied");
    copyIcon.textContent = "✓";
    copyText.textContent = "복사됨!";
    setTimeout(() => {
      copyBtn.classList.remove("copied");
      copyIcon.textContent = "📋";
      copyText.textContent = "복사";
    }, 2000);
  }

  // 구형 브라우저 폴백: contenteditable div를 선택하면 brower가 자동으로 HTML도 클립보드에 넣음
  function fallbackCopyRich(html, text) {
    const div = document.createElement("div");
    div.contentEditable = "true";
    div.innerHTML = html;
    div.style.position = "fixed";
    div.style.top = "-9999px";
    div.style.opacity = "0";
    document.body.appendChild(div);
    const range = document.createRange();
    range.selectNodeContents(div);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    try {
      document.execCommand("copy");
      showCopySuccess();
    } catch (_e) {
      // 최종 폴백: 텍스트만
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showCopySuccess();
      } catch (_e2) {
        alert("복사 실패. 직접 선택해서 복사해주세요.");
      }
    }
    sel.removeAllRanges();
    document.body.removeChild(div);
  }
}

// Markdown → Plain text (복사용: 메모장 등 plain text 환경에서 깔끔하게 보이도록)
function markdownToPlainText(md) {
  if (!md) return "";
  let text = md;

  // 1) markdown 표 → 정렬된 텍스트 표
  text = text.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const dataLines = [lines[0], ...lines.slice(2)];
    const rows = dataLines.map(line => {
      const cells = line.split("|");
      // 좌우 빈 셀 제거
      if (cells.length > 0 && !cells[0].trim()) cells.shift();
      if (cells.length > 0 && !cells[cells.length - 1].trim()) cells.pop();
      // 셀 내 markdown bold 등 정리
      return cells.map(c => c.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").trim());
    });
    // 각 컬럼의 최대 너비 (한글 가독성 위해 [...]로 char 단위)
    const widths = [];
    rows.forEach(r => r.forEach((c, i) => {
      widths[i] = Math.max(widths[i] || 0, [...c].length);
    }));
    const formatted = rows.map(r =>
      r.map((c, i) => c + " ".repeat(Math.max(0, widths[i] - [...c].length))).join("  │  ")
    );
    // 헤더 아래 구분선
    const sep = widths.map(w => "─".repeat(w)).join("──┼──");
    return "\n" + formatted[0] + "\n" + sep + "\n" + formatted.slice(1).join("\n") + "\n";
  });

  // 2) 헤더 (##, ###) 제거
  text = text.replace(/^#{1,6}\s+/gm, "");

  // 3) 굵은 글씨 / 이탤릭 마크다운 제거
  text = text.replace(/\*\*(.+?)\*\*/g, "$1");
  text = text.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, "$1");

  // 4) 인라인 코드 제거
  text = text.replace(/`([^`]+)`/g, "$1");

  // 5) 링크 [텍스트](url) → 텍스트
  text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");

  // 6) 여러 줄바꿈 정리
  text = text.replace(/\n{3,}/g, "\n\n");

  return text.trim();
}

async function doSearch() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;
  
  if (CHUNKS.length === 0) {

    return;
  }

    return;
  }
  
  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  btn.textContent = "검색 중...";
  
  document.getElementById("welcome").style.display = "none";
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  const sourcesSection = document.getElementById("sourcesSection");
  aiBox.classList.add("on");
  sourcesSection.style.display = "none";
  aiContent.innerHTML = `<div class="ai-loading"><div class="spinner"></div>관련 자료 검색 중...</div>`;
  
  const startTime = Date.now();
  
  try {
    // 1. 관련 청크 검색 (하이브리드: 의미 + 키워드)
    let topChunks;
    if (HAS_EMBEDDINGS) {
      document.getElementById("aiSub").textContent = "의미 + 키워드 검색 중...";
      
      // 1-A. 의미 검색 (8개)
      const semanticResults = await searchSemantic(query, 8);
      
      // 1-B. 키워드 검색 (5개) - 의미 검색이 놓친 자료 보완
      const keywordResults = searchKeyword(query, 5);
      
      // 1-C. 두 결과 병합 (중복 제거)
      const seen = new Set(semanticResults.map(r => r.chunk.id));
      const merged = [...semanticResults];
      for (const k of keywordResults) {
        if (!seen.has(k.chunk.id)) {
          merged.push(k);
          seen.add(k.chunk.id);
        }
      }
      
      // 최대 10개로 제한
      topChunks = merged.slice(0, 10);
      console.log(`✓ 하이브리드 검색: 의미 ${semanticResults.length} + 키워드 추가 ${merged.length - semanticResults.length}`);
    } else {
      document.getElementById("aiSub").textContent = "키워드 검색 중...";
      topChunks = searchKeyword(query, 8);
    }
    
    if (topChunks.length === 0) {
      aiContent.innerHTML = `<div class="error-msg">관련 자료를 찾을 수 없습니다. 다른 키워드로 시도해보세요.</div>`;
      return;
    }
    
    // 2. AI 답변 생성
    aiContent.innerHTML = `<div class="ai-loading"><div class="spinner"></div>답변 생성 중...</div>`;
    document.getElementById("aiSub").textContent = "AI 답변 작성 중...";
    
    const answer = await generateAnswer(query, topChunks);
    
    // 답변 저장 (복사 버튼용)
    _lastAnswer = answer;
    
    // 3. 렌더링
    aiContent.innerHTML = renderMarkdown(answer);
    const elapsed = Date.now() - startTime;
    document.getElementById("aiSub").textContent = 
      `${HAS_EMBEDDINGS ? "의미 검색" : "키워드 검색"} · ${topChunks.length}개 자료 · ${elapsed}ms`;
    
    // 복사 버튼 표시
    document.getElementById("copyBtn").style.display = "flex";
    
    renderSources(topChunks);
    sourcesSection.style.display = "block";
    
    // 4. 로그 기록 (캐시 답변일 땐 스킵, write 절약)
    const isCached = answer.includes("이전 답변 캐시 사용");
    if (!isCached) {
      try {
        db.collection("search_logs").add({
          query: query.slice(0, 200),
          mode: HAS_EMBEDDINGS ? "semantic" : "keyword",
          result_count: topChunks.length,
          elapsed_ms: elapsed,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) { console.warn("로그 실패:", e); }
    }
    
  } catch (e) {
    console.error(e);
    aiContent.innerHTML = `<div class="error-msg">❌ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "AI 검색";
  }
}

// ====================================================
// 의미 검색
// ====================================================
async function searchSemantic(query, topK) {
  const queryEmb = await embedQuery(query);
  const scored = [];
  for (const chunk of CHUNKS) {
    const emb = EMBEDDINGS[chunk.id];
    if (!emb) continue;
    scored.push({ chunk, score: cosineSim(queryEmb, emb) });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

async function embedQuery(text) {
  if (!GEMINI_KEY) {
    throw new Error("Gemini API 키가 등록되지 않았습니다. 관리자가 Gemini 키를 Firestore에 등록해야 합니다.");
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent?key=${GEMINI_KEY}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "models/gemini-embedding-001",
      content: { parts: [{ text }] },
      taskType: "RETRIEVAL_QUERY"
    })
  });
  if (!res.ok) {
    const err = await res.text();
    if (res.status === 429) {
      throw new Error(`임베딩 quota 초과. 잠시 후 다시 시도하거나 관리자에게 Gemini 키 갱신을 문의하세요.`);
    }
    if (res.status === 400 || res.status === 403) {
      throw new Error(`Gemini 키 문제 (${res.status}). 관리자가 Firestore의 gemini_api_key를 새 키로 갱신해야 합니다.`);
    }
    throw new Error(`임베딩 오류 (${res.status}): ${err.slice(0, 100)}`);
  }
  const data = await res.json();
  return data.embedding.values;
}

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-10);
}

// ====================================================
// 키워드 검색 (fallback)
// ====================================================
function searchKeyword(query, topK) {
  const tokens = query.toLowerCase().split(/[\s,.\?!()[\]{}'":;~`!@#$%^&*+=<>\/\\|]+/).filter(t => t.length >= 2);
  if (tokens.length === 0) return [];
  
  const scored = [];
  for (const chunk of CHUNKS) {
    const text = (chunk.search_text || "").toLowerCase();
    let score = 0;
    for (const token of tokens) {
      const re = new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
      const matches = text.match(re);
      if (matches) {
        score += matches.length * Math.min(token.length / 2, 3);
        if ((chunk.title || "").toLowerCase().includes(token)) score += 5;
      }
    }
    if (score > 0) scored.push({ chunk, score: score / 50 });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

// ====================================================
// AI 답변 생성 (Groq 전용 - Gemini 폴백 없음)
// ====================================================
async function generateAnswer(query, topChunks) {
  // [캐싱] 동일 질문이면 캐시 반환 (quota 절약!)
  const cacheKey = "ans_" + simpleHash(query.toLowerCase().trim());
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const obj = JSON.parse(cached);
      // 24시간 이내 캐시면 사용
      if (Date.now() - obj.ts < 24 * 60 * 60 * 1000) {
        console.log("✓ 캐시된 답변 사용 (quota 절약)");
        // ★ 옛 버전 캐시에 raw HTML 태그가 남아있을 수 있으므로 postProcessKorean 한 번 더 적용
        const cleaned = postProcessKorean(obj.answer);
        // 정리된 결과가 원본과 다르면 캐시 업데이트 (다음 번부터는 정리된 채로 빠르게 반환)
        if (cleaned !== obj.answer) {
          cacheAnswer(cacheKey, cleaned);
        }
        return cleaned + "\n\n*(이전 답변 캐시 사용 · API 호출 0회)*";
      }
    }
  } catch (e) { /* 캐시 실패는 무시 */ }
  
  // [토큰 절약] 자료 content를 800자로 제한 (Groq TPM 한도 12000 안에서 안정 동작)
  // 캐시에서 로드된 chunks는 content가 없을 수 있으므로 search_text를 폴백으로 사용
  // (search_text = title + "\n" + content 형태라 title 부분은 별도로 안 붙임)
  const context = topChunks.map((x, i) => {
    const c = x.chunk;
    const body = c.content || c.search_text || "";
    const trimmed = body.slice(0, 800);
    if (c.content) {
      return `[자료${i+1}] ${c.source}/${c.category || ""}\n${c.title}\n${trimmed}`;
    } else {
      // search_text 폴백: 이미 title 포함되어 있어 별도로 안 붙임
      return `[자료${i+1}] ${c.source}/${c.category || ""}\n${trimmed}`;
    }
  }).join("\n---\n");
  
  const userMsg = `[참고 자료]\n${context}\n\n[질문]\n${query}\n\n위 자료만 근거로 답변. 반드시 한국어, HTML 태그 금지, markdown만.\n\n🚫 조항 번호(제○조/제○장/○항/○호) 본문·출처 모두 인용 금지. 자료 내용을 풀어쓰되 조항 번호는 배제.\n\n📋 답변 구조: 결론 1문장 → **굵은 섹션 헤더** + 「**라벨**: 설명.」 형식 불릿 → 비교 필요시 markdown 표 → **유의사항** 섹션 → 📎 [자료명].\n\n⚠️ 답변 길이 가이드 (질문 복잡도에 맞춰서):\n- 단순 사실 질문 (얼마/무엇/가능?): 3-8줄 (결론 + 짧은 표 + 출처)\n- 일반 절차 질문: 10-15줄 (결론 + 단계 + 유의사항)\n- 복잡한 정책/예외 질문: 20-40줄 (결론 + 근거 + 표 + 조치 + 유의사항 + 출처)\n- 자료 부족: 2-5줄\n\n질문이 단순하면 답변도 단순하게! 모든 답변에 모든 섹션 강제로 넣지 말 것.\n\n구조: 결론(1-2문장) → 필요한 섹션만 → 자료에 예외/제한이 있을 때만 **유의사항** → 📎 출처.`;
  
  // ★ Groq 사용 (Gemini 폴백 없음 - quota 부담 X)
  if (!GROQ_KEY) {
    throw new Error("Groq API 키가 등록되지 않았습니다. 관리자에게 문의하세요.");
  }
  
  const answer = await callGroq(userMsg);
  cacheAnswer(cacheKey, answer);
  return answer;
}

// Groq API 호출 (Llama 3.3 70B - 한국어 좋음)
// 429 (Rate limit) 시 1회 자동 재시도 (서버가 알려준 대기 시간 또는 12초 기본)
async function callGroq(userMsg, retryCount = 0) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${GROQ_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: userMsg }
      ],
      max_tokens: 2048,
      temperature: 0.2
    })
  });

  if (!res.ok) {
    const errText = await res.text();
    // 429 Rate limit → 자동 재시도 (1회만)
    if (res.status === 429 && retryCount < 1) {
      // Groq는 응답 본문에 "try again in 15.2s" 같은 안내를 줌. 헤더 retry-after도 확인.
      let waitSec = parseFloat(res.headers.get("retry-after") || "0");
      if (!waitSec || waitSec < 0.5) {
        const m = errText.match(/try again in ([\d.]+)\s*s/i);
        waitSec = m ? parseFloat(m[1]) : 0;
      }
      // 최소 5초, 최대 60초로 클램프 (안전장치)
      waitSec = Math.max(5, Math.min(60, waitSec || 12));
      console.warn(`⏳ Groq Rate Limit (429) — ${waitSec.toFixed(1)}초 대기 후 자동 재시도`);
      // 사용자에게도 진행 상황 노출
      try { showLoadingMessage(`잠시만요... API 한도로 ${Math.ceil(waitSec)}초 대기 중`); } catch (_e) {}
      await new Promise(r => setTimeout(r, Math.round(waitSec * 1000)));
      return callGroq(userMsg, retryCount + 1);
    }
    // 429 재시도 후에도 실패하면 사용자에게 친절한 안내
    if (res.status === 429) {
      throw new Error("일시적으로 API 사용량이 많습니다. 1분 후 다시 시도해주세요.");
    }
    throw new Error(`Groq 오류 (${res.status}): ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  if (!data.choices || !data.choices[0]) throw new Error("Groq 응답이 비어있습니다");
  return postProcessKorean(data.choices[0].message.content);
}

// 답변 후처리: 외국어 단어 → 한국어 자동 변환
function postProcessKorean(text) {
  if (!text) return text;
  let result = text;

  // ★★ 0단계 — LLM이 섹션 헤더를 평문으로 쓰고 곧바로 <ul>/<table>을 붙이는 케이스 보정
  // 예: "지원 기준<ul>..." → "**지원 기준**\n<ul>..."
  // 예: "복귀 시점별 정산 범위 비교<table>..." → "**복귀 시점별 정산 범위 비교**\n<table>..."
  // 짧은 한글 헤더 텍스트(공백 포함 최대 30자)가 <ul>/<ol>/<table> 직전에 붙어있는 경우만
  // [^\n*><] : 시작은 개행/별표/꺾쇠 제외 (이전 태그의 </ul> 같은 게 헤더로 잡히지 않도록)
  result = result.replace(/([^\n*><][^\n<>]{0,29}?)(<(?:ul|ol|table)[^>]*>)/gi, (m, header, tag) => {
    const trimmed = header.trim();
    if (!trimmed) return m;
    // 이미 markdown bold면 건드리지 않음
    if (/^\*\*.+\*\*$/.test(trimmed)) return m;
    // 헤더에 HTML 태그 부스러기가 남았다면 건드리지 않음 (안전망)
    if (/[<>]/.test(trimmed)) return m;
    return `\n\n**${trimmed}**\n\n${tag}`;
  });

  // ★ 강조 태그를 먼저 markdown으로 변환 (표/리스트 안의 굵은 글씨 보존을 위해 우선 처리)
  result = result.replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**');
  result = result.replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, '**$1**');
  result = result.replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*');
  result = result.replace(/<i[^>]*>([\s\S]*?)<\/i>/gi, '*$1*');

  // ★ HTML 태그 → markdown 자동 변환 (LLM이 HTML로 답변한 경우)
  // 표 변환 (<table>...<tbody>...</table> → markdown 표)
  result = result.replace(/<table[^>]*>([\s\S]*?)<\/table>/gi, (match, content) => {
    // thead 추출
    let headerRow = '';
    const theadMatch = content.match(/<thead[^>]*>([\s\S]*?)<\/thead>/i);
    if (theadMatch) {
      const headerCells = theadMatch[1].match(/<th[^>]*>([\s\S]*?)<\/th>/gi) || [];
      const headers = headerCells.map(c => c.replace(/<[^>]*>/g, '').trim());
      if (headers.length > 0) {
        headerRow = '| ' + headers.join(' | ') + ' |\n';
        headerRow += '|' + headers.map(() => '------').join('|') + '|\n';
      }
    }
    
    // tbody (또는 직접 tr) 추출
    const bodyContent = content.replace(/<thead[^>]*>[\s\S]*?<\/thead>/i, '');
    const rows = bodyContent.match(/<tr[^>]*>([\s\S]*?)<\/tr>/gi) || [];
    const bodyRows = rows.map(row => {
      const cells = row.match(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi) || [];
      const cellTexts = cells.map(c => c.replace(/<[^>]*>/g, '').trim());
      return '| ' + cellTexts.join(' | ') + ' |';
    }).join('\n');
    
    return '\n' + headerRow + bodyRows + '\n';
  });
  
  // 목록 변환 (<ul>...<li>...</li>...</ul> → - 항목)
  result = result.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n' + items.map(item => '- ' + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n';
  });
  
  result = result.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, (match, content) => {
    const items = content.match(/<li[^>]*>([\s\S]*?)<\/li>/gi) || [];
    return '\n' + items.map((item, i) => `${i+1}. ` + item.replace(/<[^>]*>/g, '').trim()).join('\n') + '\n';
  });
  
  // 단독 li 변환 (목록 컨테이너 밖에 있는 경우)
  result = result.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, '\n- $1');
  
  // 줄바꿈 태그
  result = result.replace(/<br\s*\/?>/gi, '\n');
  result = result.replace(/<\/?p[^>]*>/gi, '\n');

  // ★★★ 최종 안전망: 위 변환에서 놓친 어떤 HTML 태그라도 강제 제거
  // - 닫는 태그 누락, 비정상 중첩, 알 수 없는 태그명까지 모두 정리
  // - <foo>, </foo>, <foo attr="x">, <foo/>, <foo /> 모든 형태 매칭
  result = result.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^<>]*?)?\/?>/g, '');
  // HTML 엔티티가 raw로 남아있는 경우도 정리 (LLM이 가끔 &lt;ul&gt; 형태로 출력)
  result = result.replace(/&lt;\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^&]*?)?&gt;/g, '');
  
  // 일본어 → 한국어 변환
  const jpReplacements = [
    [/ただし[、,]?\s*/g, '다만, '],
    [/しかし[、,]?\s*/g, '하지만, '],
    [/また[、,]?\s*/g, '또한, '],
    [/および/g, '및'],
    [/なお[、,]?\s*/g, '참고로, '],
    [/さらに[、,]?\s*/g, '추가로, '],
    [/ところで[、,]?\s*/g, '그런데, '],
    [/つまり[、,]?\s*/g, '즉, '],
    [/もしくは/g, '또는'],
    [/その他/g, '기타'],
    [/について/g, '에 대해'],
    [/に関して/g, '에 관해'],
  ];
  
  // 영어 연결어 → 한국어
  const enReplacements = [
    [/\bHowever,\s*/g, '하지만, '],
    [/\bhowever,\s*/g, '하지만, '],
    [/\bHowever\b/g, '하지만'],
    [/\bBut,\s*/g, '하지만, '],
    [/\bMoreover,\s*/g, '또한, '],
    [/\bFurthermore,\s*/g, '또한, '],
    [/\bAdditionally,\s*/g, '추가로, '],
    [/\bTherefore,\s*/g, '따라서, '],
    [/\bIn addition,\s*/g, '또한, '],
    [/\bAlso,\s*/g, '또한, '],
    [/\bFor example,\s*/g, '예를 들어, '],
    [/\bFor instance,\s*/g, '예를 들어, '],
    [/\bIn other words,\s*/g, '즉, '],
    [/\bThus,\s*/g, '따라서, '],
    [/\bHence,\s*/g, '따라서, '],
    [/\bMeanwhile,\s*/g, '한편, '],
    [/\bOn the other hand,\s*/g, '반면, '],
    [/\bIn conclusion,\s*/g, '결론적으로, '],
    [/\bAs a result,\s*/g, '그 결과, '],
  ];
  
  jpReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  enReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  
  // 일본어 문자가 남아있으면 콘솔 경고
  if (/[\u3040-\u309F\u30A0-\u30FF]/.test(result)) {
    console.warn("⚠ 답변에 일본어 문자가 남아있습니다:", result.match(/[\u3040-\u309F\u30A0-\u30FF]+/g));
  }
  
  // 여러 줄바꿈 정리
  result = result.replace(/\n{3,}/g, '\n\n');
  
  return result.trim();
}

// 답변 캐싱 헬퍼
function cacheAnswer(cacheKey, answer) {
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() }));
  } catch (e) {
    // quota 초과 → 옛 답변 캐시 절반 정리 후 재시도
    if (e && (e.name === "QuotaExceededError" || /quota/i.test(e.message || ""))) {
      const cleared = cleanupOldAnswerCache(0.5);
      console.warn(`⚠ 답변 캐시 quota 초과 → 옛 답변 ${cleared}개 정리 후 재시도`);
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() }));
      } catch (e2) {
        console.warn("답변 캐시 저장 포기 (메모리에만 유지):", e2.message);
      }
    }
  }
}

// 메타데이터 캐시 저장 시도 — 실패 시 단계적으로 옛 캐시 정리 후 재시도
function trySaveMetaCache(metaJson, metaKey, timeKey, countKey, chunkCount) {
  const setAll = () => {
    localStorage.setItem(metaKey, metaJson);
    localStorage.setItem(timeKey, String(Date.now()));
    localStorage.setItem(countKey, String(chunkCount));
  };
  // 시도 1: 그대로 저장
  try {
    setAll();
    console.log(`✓ 메타데이터 캐시 저장 (${chunkCount}개)`);
    return true;
  } catch (e) {
    if (!isQuotaError(e)) {
      console.error("❌ 메타데이터 캐시 저장 실패 (quota 외):", e.message);
      return false;
    }
  }
  // 시도 2: 답변 캐시 전부 정리 후 재시도
  const ansCleared = cleanupOldAnswerCache(1.0);
  console.warn(`⚠ 메타 캐시 quota 초과 → 답변 캐시 ${ansCleared}개 정리 후 재시도`);
  try {
    setAll();
    console.log(`✓ 메타데이터 캐시 저장 (${chunkCount}개, 답변 캐시 정리 후)`);
    return true;
  } catch (e) {
    if (!isQuotaError(e)) return false;
  }
  // 시도 3: 임베딩 캐시도 정리 후 재시도 (검색은 메모리상 임베딩으로 가능)
  try {
    localStorage.removeItem("triplus_chunks_emb");
    console.warn("⚠ 임베딩 캐시도 정리 (이번 세션은 메모리 임베딩 사용)");
    setAll();
    console.log(`✓ 메타데이터 캐시 저장 (${chunkCount}개, 임베딩 캐시도 정리 후)`);
    return true;
  } catch (e) {
    console.error("❌ 메타데이터 캐시 저장 최종 실패. 이번 세션만 작동, 다음 방문 시 다시 로드됨:", e.message);
    return false;
  }
}

function isQuotaError(e) {
  return e && (e.name === "QuotaExceededError"
            || e.name === "NS_ERROR_DOM_QUOTA_REACHED"
            || /quota/i.test(e.message || ""));
}

// 옛 답변 캐시 정리: ratio = 1.0이면 전부, 0.5면 오래된 절반만 삭제
function cleanupOldAnswerCache(ratio) {
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("ans_")) {
      try {
        const obj = JSON.parse(localStorage.getItem(k));
        items.push({ key: k, ts: (obj && obj.ts) || 0 });
      } catch (_e) {
        items.push({ key: k, ts: 0 });
      }
    }
  }
  // 오래된 순으로 정렬
  items.sort((a, b) => a.ts - b.ts);
  const removeCount = Math.max(1, Math.floor(items.length * ratio));
  let n = 0;
  for (let i = 0; i < removeCount && i < items.length; i++) {
    localStorage.removeItem(items[i].key);
    n++;
  }
  return n;
}

// ─── 콘솔 헬퍼 (F12에서 실행 가능) ────────────────────────────
// 답변 캐시만 삭제
window.clearAnswerCache = function() {
  const n = cleanupOldAnswerCache(1.0);
  console.log(`✅ 답변 캐시 ${n}개 삭제 완료. 페이지를 새로고침하세요.`);
  return n;
};

// 트리플러스 관련 모든 캐시 삭제 (자료/임베딩/답변 전부)
window.clearAllCache = function() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.startsWith("triplus_") || k.startsWith("ans_"))) {
      keys.push(k);
    }
  }
  keys.forEach(k => localStorage.removeItem(k));
  console.log(`✅ 트리플러스 캐시 ${keys.length}개 삭제 완료. 페이지를 새로고침하세요.`);
  return keys.length;
};

// 현재 캐시 용량 진단
window.cacheUsage = function() {
  let totalBytes = 0;
  const buckets = { meta: 0, emb: 0, answer: 0, other: 0 };
  const counts = { meta: 0, emb: 0, answer: 0, other: 0 };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    const v = localStorage.getItem(k) || "";
    // UTF-16 기준 대략 추정: 문자 수 × 2
    const bytes = (k.length + v.length) * 2;
    totalBytes += bytes;
    let bucket = "other";
    if (k === "triplus_chunks_meta") bucket = "meta";
    else if (k === "triplus_chunks_emb") bucket = "emb";
    else if (k.startsWith("ans_")) bucket = "answer";
    buckets[bucket] += bytes;
    counts[bucket]++;
  }
  const fmt = (b) => (b / 1024 / 1024).toFixed(2) + " MB";
  console.log("📊 localStorage 사용량");
  console.log(`  메타데이터 (chunks): ${fmt(buckets.meta)} (${counts.meta}개 키)`);
  console.log(`  임베딩 (embeddings): ${fmt(buckets.emb)} (${counts.emb}개 키)`);
  console.log(`  답변 캐시 (ans_*):   ${fmt(buckets.answer)} (${counts.answer}개 키)`);
  console.log(`  기타:               ${fmt(buckets.other)} (${counts.other}개 키)`);
  console.log(`  ─────────────────────────────`);
  console.log(`  합계:               ${fmt(totalBytes)} / 약 5MB 한도`);
  return { totalBytes, buckets, counts };
};

// 간단한 문자열 해시 (캐시 키용)
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}

// ====================================================
// Markdown 렌더링
// ====================================================
function renderMarkdown(md) {
  // ★ 렌더링 직전 최종 sanitize: postProcessKorean이 어떤 경로로든 누락된 경우의 마지막 방어선
  // - LLM이 출력했을 가능성이 있는 모든 raw HTML 태그를 markdown으로 변환하거나 제거
  if (md && /<[a-zA-Z]/.test(md)) {
    md = postProcessKorean(md);
  }
  let html = md;
  // 표
  html = html.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const header = lines[0].split("|").filter(c => c.trim()).map(c => `<th>${escapeHtml(c.trim())}</th>`).join("");
    const rows = lines.slice(2).map(line => {
      const cells = line.split("|").filter((c, i, a) => !(i === 0 && !c.trim()) && !(i === a.length - 1 && !c.trim()));
      return "<tr>" + cells.map(c => `<td>${renderInline(c.trim())}</td>`).join("") + "</tr>";
    }).join("");
    return `<table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // 헤딩
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  // 리스트
  html = html.replace(/(?:^- (.+)$\n?)+/gm, (m) => {
    const items = m.trim().split(/\n/).map(line => line.replace(/^- /, "").trim());
    return "<ul>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ul>";
  });
  // 줄바꿈
  html = html.split(/\n\n+/).map(p => {
    if (p.match(/^<(h\d|ul|ol|table|pre)/)) return p;
    return `<p>${renderInline(p)}</p>`;
  }).join("");
  return html;
}

function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\n/g, "<br>");
  return text;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ====================================================
// 출처 렌더링
// ====================================================
function renderSources(topChunks) {
  const list = document.getElementById("sourcesList");
  list.innerHTML = topChunks.map((x, i) => {
    const c = x.chunk;
    const tagClass = getTagClass(c.source);
    const tagLabel = (c.source || "").split("/")[0];
    const score = `${(x.score * 100).toFixed(0)}%`;
    return `<div class="source-card" onclick="toggleSource(${i})">
      <div class="source-card-hdr">
        <span class="source-tag ${tagClass}">${escapeHtml(tagLabel)}</span>
        <span class="source-title">${escapeHtml((c.title || "").slice(0, 80))}</span>
        <span class="source-score">${score}</span>
      </div>
      <div class="source-body">${escapeHtml(c.content || "")}</div>
    </div>`;
  }).join("");
}

function getTagClass(source) {
  if (!source) return "";
  if (source.startsWith("Q&A")) return "tag-qa";
  if (source.startsWith("매뉴얼")) return "tag-manual";
  if (source.includes("규정")) return "tag-rule";
  if (source.includes("구간")) return "tag-route";
  return "";
}

function toggleSource(i) {
  document.querySelectorAll(".source-card")[i].classList.toggle("open");
}

function showError(msg) {
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  document.getElementById("sourcesSection").style.display = "none";
  aiBox.classList.add("on");
  aiContent.innerHTML = `<div class="info-msg">${msg}</div>`;
}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

// 시작
init();
