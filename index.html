async function init() {

  try {

    const configDoc = await db.collection("config").doc("public").get();

      setStatus("설정 필요", "err");
      showError("관리자가 아직 시스템을 초기화하지 않았습니다.<br>관리자 페이지에서 초기 설정을 완료해주세요.");

    GEMINI_KEY = configDoc.data().gemini_api_key || "";
    GROQ_KEY = configDoc.data().groq_api_key || "";
    
    if (!GEMINI_KEY && !GROQ_KEY) {
      setStatus("API 키 없음", "err");
      showError("API 키가 설정되지 않았습니다.<br>관리자가 Gemini 또는 Groq 키를 등록해주세요.");

    if (!GROQ_KEY) {

    // 2. 자료 로드 - 캐시 우선 사용 (Firebase reads 최소화)

    const CACHE_COUNT_KEY = "triplus_chunks_count";
    const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // 7일
    const CHECK_INTERVAL = 12 * 60 * 60 * 1000; // 12시간
    
    // 강제 새로고침 체크 (?refresh=1)
    const urlParams = new URLSearchParams(window.location.search);
    const forceRefresh = urlParams.get('refresh') === '1';
    
    const cachedMeta = localStorage.getItem(META_CACHE_KEY);
    const cacheTime = parseInt(localStorage.getItem(CACHE_TIME_KEY) || "0");
    const cacheAge = Date.now() - cacheTime;
    const isValid = !forceRefresh && cachedMeta && cacheAge < CACHE_MAX_AGE;
    
    if (isValid) {
      try {
        // 메타데이터 먼저 로드 (빠름!)
        CHUNKS = JSON.parse(cachedMeta);
        
        // 임베딩은 별도로 로드 시도 (실패해도 메타로 검색 가능)
        try {
          const cachedEmb = localStorage.getItem(EMB_CACHE_KEY);
          if (cachedEmb) {
            EMBEDDINGS = JSON.parse(cachedEmb);
          } else {
            EMBEDDINGS = {};
          }
        } catch (e) {
          EMBEDDINGS = {};
          console.warn("임베딩 캐시 로드 실패 (키워드 검색 모드):", e);
        }
        
        HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
        const ageHours = Math.round(cacheAge / 1000 / 60 / 60);
        console.log(`✓ 캐시 사용: ${CHUNKS.length}개 청크 (Firebase reads 0, ${ageHours}시간 전)`);
        setStatus(`✓ 준비 완료 (${CHUNKS.length}개, 캐시)`, "ok");
        
        // 백그라운드 변경 감지 (12시간 후만)
        if (cacheAge > CHECK_INTERVAL) {
          setTimeout(() => checkForUpdates(CHUNKS.length), 2000);
        }
        return;
      } catch (e) {
        console.warn("캐시 파싱 실패, 새로 로드:", e);
      }
    }
    
    // 3. Firestore에서 청크 로드 (캐시 없거나 만료)
    setStatus("자료 로드 중... (0%)", "warn");
    showLoadingMessage("자료 다운로드 중...");
    
    const snap = await db.collection("chunks").get();
    const totalDocs = snap.docs.length;
    
    setStatus(`자료 처리 중... (0/${totalDocs})`, "warn");
    showLoadingMessage(`자료 처리 중... (0/${totalDocs})`);
    
    CHUNKS = [];
    EMBEDDINGS = {};
    
    // 청크 단위로 처리 (UI 블로킹 방지)
    const BATCH_SIZE = 200;
    for (let i = 0; i < snap.docs.length; i += BATCH_SIZE) {
      const batch = snap.docs.slice(i, i + BATCH_SIZE);
      batch.forEach(doc => {
        const d = doc.data();
        CHUNKS.push({
          id: doc.id,
          source: d.source || "",
          category: d.category || "",
          title: d.title || "",
          content: d.content || "",
          search_text: d.search_text || ""
        });
        if (d.embedding && Array.isArray(d.embedding)) {
          EMBEDDINGS[doc.id] = d.embedding;
        }
      });
      
      const progress = Math.min(i + BATCH_SIZE, totalDocs);
      const percent = Math.round((progress / totalDocs) * 100);
      setStatus(`자료 처리 중... (${progress}/${totalDocs}, ${percent}%)`, "warn");
      showLoadingMessage(`자료 처리 중... (${progress}/${totalDocs})`);
      
      // UI 갱신 대기 (블로킹 방지)
      if (i + BATCH_SIZE < snap.docs.length) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    HAS_EMBEDDINGS = Object.keys(EMBEDDINGS).length > 0;
    
    // 4. 캐시 저장 (메타데이터 + 임베딩 분리)
    setStatus("캐시 저장 중...", "warn");
    showLoadingMessage("캐시 저장 중...");
    
    // 4-1. 메타데이터 저장 (가벼움, 거의 항상 성공)
    let metaSaved = false;
    try {
      localStorage.setItem(META_CACHE_KEY, JSON.stringify(CHUNKS));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
      localStorage.setItem(CACHE_COUNT_KEY, String(CHUNKS.length));
      metaSaved = true;
      console.log(`✓ 메타데이터 캐시 저장 (${CHUNKS.length}개)`);
    } catch (e) {
      console.error("❌ 메타데이터 캐시 저장 실패:", e.message);
    }
    
    // 4-2. 임베딩 저장 (무거움, 용량 초과 가능)
    if (HAS_EMBEDDINGS) {
      try {
        localStorage.setItem(EMB_CACHE_KEY, JSON.stringify(EMBEDDINGS));
        console.log(`✓ 임베딩 캐시 저장 (${Object.keys(EMBEDDINGS).length}개)`);
      } catch (e) {
        console.warn(`⚠ 임베딩 캐시 저장 실패 (용량 초과). 키워드 검색은 정상 작동:`, e.message);
        // 임베딩 저장 실패해도 검색은 가능 (메모리에는 있음)
        // 다음 방문 시는 임베딩 없이 키워드 검색만 가능
      }
    }
    
    if (metaSaved) {
      console.log(`✓ 다음 7일 동안 Firebase reads 0`);
    }
    
    hideLoadingMessage();
    setStatus(`✓ 준비 완료 (${CHUNKS.length}개)`, "ok");
    console.log(`✅ ${CHUNKS.length}개 청크, ${Object.keys(EMBEDDINGS).length}개 임베딩 로드됨`);
    
  } catch (e) {
    console.error(e);
    hideLoadingMessage();
    setStatus("연결 실패", "err");
    showError(`초기화 실패: ${e.message}<br>잠시 후 새로고침 해보세요.`);
  }
}

      console.log("자료 변경 감지 패스 (count 미지원)");
      return;

    if (serverCount !== null && serverCount !== cachedCount) {

// ====================================================
// 의미 검색
// ====================================================
async function searchSemantic(query, topK) {
  const queryEmb = await embedQuery(query);
  const scored = [];
  for (const chunk of CHUNKS) {
    const emb = EMBEDDINGS[chunk.id];
    if (!emb) continue;
    scored.push({ chunk, score: cosineSim(queryEmb, emb) });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

async function embedQuery(text) {
  if (!GEMINI_KEY) {
    throw new Error("Gemini API 키가 등록되지 않았습니다. 관리자가 Gemini 키를 Firestore에 등록해야 합니다.");
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent?key=${GEMINI_KEY}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "models/gemini-embedding-001",
      content: { parts: [{ text }] },
      taskType: "RETRIEVAL_QUERY"
    })
  });
  if (!res.ok) {
    const err = await res.text();
    if (res.status === 429) {
      throw new Error(`임베딩 quota 초과. 잠시 후 다시 시도하거나 관리자에게 Gemini 키 갱신을 문의하세요.`);
    }
    if (res.status === 400 || res.status === 403) {
      throw new Error(`Gemini 키 문제 (${res.status}). 관리자가 Firestore의 gemini_api_key를 새 키로 갱신해야 합니다.`);
    }
    throw new Error(`임베딩 오류 (${res.status}): ${err.slice(0, 100)}`);
  }
  const data = await res.json();
  return data.embedding.values;
}

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-10);
}

// ====================================================
// 키워드 검색 (fallback)
// ====================================================
function searchKeyword(query, topK) {
  const tokens = query.toLowerCase().split(/[\s,.\?!()[\]{}'":;~`!@#$%^&*+=<>\/\\|]+/).filter(t => t.length >= 2);
  if (tokens.length === 0) return [];
  
  const scored = [];
  for (const chunk of CHUNKS) {
    const text = (chunk.search_text || "").toLowerCase();
    let score = 0;
    for (const token of tokens) {
      const re = new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
      const matches = text.match(re);
      if (matches) {
        score += matches.length * Math.min(token.length / 2, 3);
        if ((chunk.title || "").toLowerCase().includes(token)) score += 5;
      }
    }
    if (score > 0) scored.push({ chunk, score: score / 50 });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

// AI 답변 생성 (Groq 전용 - Gemini 폴백 없음)
// ====================================================
async function generateAnswer(query, topChunks) {
  // [캐싱] 동일 질문이면 캐시 반환 (quota 절약!)
  const cacheKey = "ans_" + simpleHash(query.toLowerCase().trim());
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const obj = JSON.parse(cached);
      // 24시간 이내 캐시면 사용
      if (Date.now() - obj.ts < 24 * 60 * 60 * 1000) {
        console.log("✓ 캐시된 답변 사용 (quota 절약)");
        return obj.answer + "\n\n*(이전 답변 캐시 사용 · API 호출 0회)*";
      }
    }
  } catch (e) { /* 캐시 실패는 무시 */ }
  
  // [토큰 절약] 자료 content 600자로 제한
  const context = topChunks.map((x, i) => {
    const c = x.chunk;
    const content = (c.content || "").slice(0, 800);
    return `[자료${i+1}] ${c.source}/${c.category || ""}
${c.title}
${content}`;
  }).join("\n---\n");
  
  const userMsg = `[참고 자료]\n${context}\n\n[질문]\n${query}\n\n위 자료만 근거로 답변. 반드시 한국어로만 답변하고 다른 언어 단어 사용 금지. 결론 먼저 + 충분한 근거를 bullet/표로 정리.`;
  
  // ★ Groq 사용 (Gemini 폴백 없음 - quota 부담 X)
  if (!GROQ_KEY) {
    throw new Error("Groq API 키가 등록되지 않았습니다. 관리자에게 문의하세요.");
  }
  
  const answer = await callGroq(userMsg);
  cacheAnswer(cacheKey, answer);
  return answer;
}

// Groq API 호출 (Llama 3.3 70B - 한국어 좋음)
async function callGroq(userMsg) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${GROQ_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: userMsg }
      ],
      max_tokens: 1536,
      temperature: 0.2
    })
  });
  
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Groq 오류 (${res.status}): ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  if (!data.choices || !data.choices[0]) throw new Error("Groq 응답이 비어있습니다");
  return postProcessKorean(data.choices[0].message.content);
}

// 답변 후처리: 외국어 단어 → 한국어 자동 변환
function postProcessKorean(text) {
  if (!text) return text;
  let result = text;
  
  // 일본어 → 한국어 변환 (자주 나오는 연결어/접속어)
  const jpReplacements = [
    [/ただし[、,]?\s*/g, '다만, '],
    [/しかし[、,]?\s*/g, '하지만, '],
    [/また[、,]?\s*/g, '또한, '],
    [/および/g, '및'],
    [/なお[、,]?\s*/g, '참고로, '],
    [/さらに[、,]?\s*/g, '추가로, '],
    [/ところで[、,]?\s*/g, '그런데, '],
    [/つまり[、,]?\s*/g, '즉, '],
    [/もしくは/g, '또는'],
    [/その他/g, '기타'],
    [/について/g, '에 대해'],
    [/および/g, '및'],
    [/に関して/g, '에 관해'],
    [/から/g, '부터'],
    [/まで/g, '까지'],
    [/より/g, '보다'],
  ];
  
  // 영어 연결어 → 한국어 (단어 경계 \b 사용으로 안전)
  const enReplacements = [
    [/\bHowever,\s*/g, '하지만, '],
    [/\bhowever,\s*/g, '하지만, '],
    [/\bHowever\b/g, '하지만'],
    [/\bBut,\s*/g, '하지만, '],
    [/\bMoreover,\s*/g, '또한, '],
    [/\bFurthermore,\s*/g, '또한, '],
    [/\bAdditionally,\s*/g, '추가로, '],
    [/\bTherefore,\s*/g, '따라서, '],
    [/\bIn addition,\s*/g, '또한, '],
    [/\bAlso,\s*/g, '또한, '],
    [/\bFor example,\s*/g, '예를 들어, '],
    [/\bFor instance,\s*/g, '예를 들어, '],
    [/\bIn other words,\s*/g, '즉, '],
    [/\bThus,\s*/g, '따라서, '],
    [/\bHence,\s*/g, '따라서, '],
    [/\bMeanwhile,\s*/g, '한편, '],
    [/\bOn the other hand,\s*/g, '반면, '],
    [/\bIn conclusion,\s*/g, '결론적으로, '],
    [/\bAs a result,\s*/g, '그 결과, '],
  ];
  
  jpReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  enReplacements.forEach(([pattern, korean]) => {
    result = result.replace(pattern, korean);
  });
  
  // 일본어 문자(히라가나/가타카나)가 남아있으면 콘솔 경고
  if (/[\u3040-\u309F\u30A0-\u30FF]/.test(result)) {
    console.warn("⚠ 답변에 일본어 문자가 남아있습니다:", result.match(/[\u3040-\u309F\u30A0-\u30FF]+/g));
  }
  
  return result;
}

// 답변 캐싱 헬퍼
function cacheAnswer(cacheKey, answer) {
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ answer, ts: Date.now() }));
  } catch (e) { /* 캐시 저장 실패 무시 */ }
}

// 간단한 문자열 해시 (캐시 키용)
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}

// ====================================================
// Markdown 렌더링
// ====================================================
function renderMarkdown(md) {
  let html = md;
  // 표
  html = html.replace(/(\|[^\n]+\|\n\|[\s\-:|]+\|\n(?:\|[^\n]+\|\n?)+)/g, (table) => {
    const lines = table.trim().split("\n");
    const header = lines[0].split("|").filter(c => c.trim()).map(c => `<th>${escapeHtml(c.trim())}</th>`).join("");
    const rows = lines.slice(2).map(line => {
      const cells = line.split("|").filter((c, i, a) => !(i === 0 && !c.trim()) && !(i === a.length - 1 && !c.trim()));
      return "<tr>" + cells.map(c => `<td>${renderInline(c.trim())}</td>`).join("") + "</tr>";
    }).join("");
    return `<table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // 헤딩
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  // 리스트
  html = html.replace(/(?:^- (.+)$\n?)+/gm, (m) => {
    const items = m.trim().split(/\n/).map(line => line.replace(/^- /, "").trim());
    return "<ul>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ul>";
  });
  // 줄바꿈
  html = html.split(/\n\n+/).map(p => {
    if (p.match(/^<(h\d|ul|ol|table|pre)/)) return p;
    return `<p>${renderInline(p)}</p>`;
  }).join("");
  return html;
}

function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\n/g, "<br>");
  return text;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ====================================================
// 출처 렌더링
// ====================================================
function renderSources(topChunks) {
  const list = document.getElementById("sourcesList");
  list.innerHTML = topChunks.map((x, i) => {
    const c = x.chunk;
    const tagClass = getTagClass(c.source);
    const tagLabel = (c.source || "").split("/")[0];
    const score = `${(x.score * 100).toFixed(0)}%`;
    return `<div class="source-card" onclick="toggleSource(${i})">
      <div class="source-card-hdr">
        <span class="source-tag ${tagClass}">${escapeHtml(tagLabel)}</span>
        <span class="source-title">${escapeHtml((c.title || "").slice(0, 80))}</span>
        <span class="source-score">${score}</span>
      </div>
      <div class="source-body">${escapeHtml(c.content || "")}</div>
    </div>`;
  }).join("");
}

function getTagClass(source) {
  if (!source) return "";
  if (source.startsWith("Q&A")) return "tag-qa";
  if (source.startsWith("매뉴얼")) return "tag-manual";
  if (source.includes("규정")) return "tag-rule";
  if (source.includes("구간")) return "tag-route";
  return "";
}

function toggleSource(i) {
  document.querySelectorAll(".source-card")[i].classList.toggle("open");
}

function showError(msg) {
  const aiBox = document.getElementById("aiBox");
  const aiContent = document.getElementById("aiContent");
  document.getElementById("sourcesSection").style.display = "none";
  aiBox.classList.add("on");
  aiContent.innerHTML = `<div class="info-msg">${msg}</div>`;
}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

init();
